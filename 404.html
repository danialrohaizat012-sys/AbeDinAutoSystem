<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Abe Din Auto</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;background:#080b0c;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}</style>
<script>
(function(){
  var path=(location.pathname||'').replace(/\/+$/,'');
  var qs=new URLSearchParams(location.search);
  if(path.endsWith('/admin')){
    location.replace('/app.html?admin=1');
    return;
  }
  if(qs.has('car')){
    location.replace('/app.html?car='+encodeURIComponent(qs.get('car')));
    return;
  }
  location.replace('/');
})();
</script>
</head>
<body></body>
</html>
