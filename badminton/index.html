<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmashKu — Sistem Kejohanan Badminton</title>
<meta name="theme-color" content="#3461e3">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Ccircle cx=%2224%22 cy=%2224%22 r=%2221%22 fill=%22%23fff%22 stroke=%22%232563eb%22 stroke-width=%224%22/%3E%3Cpath d=%22M14.5 11.5 L20.5 28 H27.5 L33.5 11.5 Q24 8.5 14.5 11.5Z%22 fill=%22%231e3a8a%22/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e5e9f0;--blue:#3461e3;--blue2:#e8eefc;--green:#2f7d5b;--green2:#e6f4ec;--amber:#b7791f;--amber2:#fdf6e3;--red:#dc2626;--red2:#fdeeee;--dark:#131c33}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 500px at 50% -10%,#e4eafb 0,transparent 70%),var(--bg);min-height:100vh}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.04)}
.pad{padding:20px}
.muted{color:var(--mut)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--blue);text-transform:uppercase}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.ic{flex:none;vertical-align:-3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#c9d3e3}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.soft{background:var(--blue2);border-color:#cfdcfb;color:var(--blue)}
.btn.danger{color:var(--red);border-color:#f5c2c2;background:var(--red2)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:#fff}
.chip.amber{background:var(--amber2);border-color:#f2dfae;color:var(--amber)}
.chip.blue{background:var(--blue2);border-color:#cfdcfb;color:var(--blue)}
.chip.green{background:var(--green2);border-color:#bfe3cf;color:var(--green)}
.chip.gray{background:#f1f3f7;color:#475569}
.chip.red{background:var(--red2);border-color:#f5c2c2;color:var(--red)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font-size:19px;display:block}
.brand small{color:var(--mut);font-size:12.5px}
.hbtns{display:flex;gap:8px}
.notice{padding:10px 14px;border-radius:12px;background:var(--amber2);color:#8a5a12;border:1px solid #f2dfae;font-size:13.5px;margin-bottom:14px}
/* bottom nav */
.bnav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;padding:6px;box-shadow:0 10px 30px rgba(15,23,42,.12);z-index:20;width:min(680px,calc(100% - 20px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;text-decoration:none;color:#475569;font-size:12px;font-weight:600}
.bnav a.on{background:var(--blue2);color:var(--blue)}
.bnav a.plus span.pl{width:42px;height:42px;margin-top:-20px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(52,97,227,.4);border:3px solid #fff}
.bnav a.plus{color:var(--blue)}
/* onboarding */
.ob{display:grid;grid-template-columns:1fr 1fr;overflow:hidden;margin-top:30px}
.obL{padding:48px 32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;background:#fafbfd;border-right:1px solid var(--line)}
.obL h1{font-size:44px}
.feat{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:10px 18px;justify-content:center;font-weight:600;color:#334155}
.obR{padding:44px 36px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.role{display:flex;align-items:center;gap:14px;border:0;border-radius:16px;padding:18px;color:#fff;text-align:left}
.role.blue{background:var(--blue)}.role.green{background:var(--green)}
.role .rico{width:48px;height:48px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.role b{font-size:18px;display:block}.role span{opacity:.9;font-size:14px}
.role .arr{margin-left:auto}
.stats{display:flex;gap:40px;padding:14px 8px}
.stats b{font-size:20px;display:block}.stats span{color:var(--mut);font-size:13px}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-weight:600;font-size:13.5px}
.fld label i{color:var(--red);font-style:normal}
.inp{width:100%;border:1px solid #d6dde8;border-radius:12px;padding:11px 13px;background:#fff;outline:none;font-size:15px}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(52,97,227,.15)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sec{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;background:#fff}
.sec h3{font-size:16px;margin-bottom:2px}
.sech{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.sech .sico{width:38px;height:38px;border-radius:10px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;flex:none}
.sub{background:#f7f9fd;border:1px solid #e3e9f5;border-radius:14px;padding:14px;margin-bottom:12px}
.sub .st{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:12px}
/* tabs */
.tabs{display:flex;gap:6px;background:#e9eef6;border-radius:16px;padding:6px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:12px 10px;font-weight:600;color:#475569;display:flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px rgba(15,23,42,.06)}
.cnt{background:#dfe6f2;border-radius:999px;padding:2px 8px;font-size:12px}
.on .cnt{background:var(--blue2)}
.srow{display:flex;gap:10px;margin-bottom:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;border:1px solid #cfdcfb;background:#eef3fd;border-radius:14px;padding:0 14px}
.search input{border:0;background:transparent;outline:none;padding:13px 0;width:100%;font-size:15px}
/* tournament cards */
.tcard{display:grid;grid-template-columns:150px 1fr 200px;gap:18px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;margin-bottom:14px;cursor:pointer;transition:border-color .15s}
.tcard:hover{border-color:#c6d3ea}
.poster{width:150px;height:190px;border-radius:12px;overflow:hidden;background:#eef2f8}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.pdef{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:linear-gradient(160deg,#ecfeff 0,#fff 45%,#d1fae5 100%);text-align:center}
.pdef b{font-size:17px;font-style:italic;color:#0f766e;letter-spacing:.02em;margin-top:6px}
.pdef span{font-size:10px;font-weight:800;font-style:italic;color:#1e293b;letter-spacing:.08em}
.pdef small{font-size:9px;font-weight:700;color:#334155;margin-top:14px;letter-spacing:.12em}
.tinfo h3{font-size:18px;text-transform:uppercase;margin:4px 0 10px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;color:#475569;font-size:14px;margin-bottom:12px}
.meta span{display:flex;gap:8px;align-items:flex-start}
.meta .full{grid-column:1/-1}
.tact{display:flex;flex-direction:column;gap:8px;align-items:stretch;justify-content:center;border-left:1px solid var(--line);padding-left:16px}
.empty{padding:40px 20px;text-align:center;color:var(--mut)}
.empty .eico{width:52px;height:52px;border-radius:14px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;margin:0 auto 12px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* detail */
.dhero{display:grid;grid-template-columns:260px 1fr;gap:22px;padding:20px;margin-bottom:16px}
.dhero .poster{width:100%;height:330px}
.dhero h2{font-size:26px;margin:8px 0 4px}
.catchips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.catchips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600;font-size:13px;color:#475569}
.catchips button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.icards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ic-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}
.ic-card h4{margin:0 0 10px;font-size:12px;letter-spacing:.1em;color:#334155;display:flex;gap:7px;align-items:center}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:14px}
.kv span:nth-child(odd){color:var(--mut)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
/* pairs */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pcard{border:1px solid var(--line);border-top:4px solid var(--red);border-radius:16px;background:#fff;overflow:hidden}
.pcard.paid{border-top-color:#16a34a}
.pcard .ph{padding:14px 16px;border-bottom:1px solid var(--line)}
.pcard .ph small{color:var(--mut);font-size:12.5px;display:flex;gap:6px;align-items:center}
.pcard .ph b{display:block;font-size:17px;margin-top:6px}
.pcard .pf{display:flex;gap:8px;padding:12px 16px}
.pcard .pf .btn{flex:1}
/* league */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.gcard{border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.ghead{background:linear-gradient(135deg,#1c2850,#141a2e 70%,#2a2224);color:#fff;padding:18px;display:flex;align-items:center;gap:12px;border-top:3px solid #5b7cf0}
.gl{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);display:grid;place-items:center;font-weight:800;font-size:20px;color:#9fb5ff}
.ghead small{font-size:10px;letter-spacing:.14em;opacity:.7;font-weight:700}
.ghead b{display:block;font-size:20px}
.stand{width:100%;border-collapse:collapse;font-size:14px}
.stand th{background:#f7f9fc;color:#64748b;font-size:11px;letter-spacing:.1em;text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.stand th:first-child{text-align:left;padding-left:16px}
.stand td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
.stand td:first-child{text-align:left;padding-left:12px}
.stand tr.q td{background:#fffaf0}
.stand tr.q td:first-child{box-shadow:inset 3px 0 0 #f59e0b}
.rk{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:700;margin-right:10px;vertical-align:middle}
.pn{display:inline-block;vertical-align:middle}
.pn small{display:block;font-size:10px;color:var(--blue);font-weight:700}
.pn b{font-size:14px}
.np{display:inline-block;min-width:34px;border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12px;font-weight:700}
.np.pos{background:#ecfdf3;color:#15803d;border-color:#bbf7d0}.np.neg{background:var(--red2);color:var(--red);border-color:#fecaca}
.w{color:var(--blue);font-weight:800;font-size:16px}
.gfoot{padding:12px 16px}
.prog{height:6px;background:#e9eef6;border-radius:9px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--blue)}
.mrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.mrow.click{cursor:pointer}.mrow.click:hover{background:#f7f9fd}
.mrow .r{text-align:right}
.mrow .won{font-weight:800}
.mrow .mid{text-align:center;font-size:12px;color:var(--mut);min-width:90px}
.mrow .mid b{display:block;color:var(--ink);font-size:13px}
/* bracket */
.bwrap{background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.06) 1px,transparent 0) 0 0/18px 18px,linear-gradient(180deg,#141d38,#0f1629);border-radius:20px;color:#fff;overflow:hidden}
.bhead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap;gap:10px}
.bhead small{font-size:10px;letter-spacing:.14em;color:#9fb5ff;font-weight:700}
.bhead b{display:block;font-size:18px}
.bstats{display:flex;gap:18px;font-size:12px;color:#aab6d3}.bstats b{display:inline;font-size:16px;color:#fff;margin-right:4px}
.bracket{display:flex;gap:26px;padding:20px;overflow-x:auto;min-height:200px}
.bcol{display:flex;flex-direction:column;min-width:230px}
.bcol .bt{font-size:10px;letter-spacing:.12em;font-weight:700;color:#aab6d3;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:7px 10px;margin-bottom:12px}
.bcol .bt.f{color:#facc15;background:rgba(250,204,21,.08);border-color:rgba(250,204,21,.25)}
.bcol .bm{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:12px}
.km{background:#fff;color:var(--ink);border-radius:12px;overflow:hidden;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.km.click{cursor:pointer}.km.click:hover{outline:2px solid #5b7cf0}
.km .kh{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;background:#f2f5fb;font-size:11.5px;color:#475569}
.km .kh b{color:var(--blue)}
.km .ks{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-top:1px solid var(--line)}
.km .ks.win{font-weight:800;background:#f0fdf4}
.km .ks.bye{color:#94a3b8;font-style:italic}
.km .sc{color:var(--mut);font-variant-numeric:tabular-nums}
/* podium */
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.podc{border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;background:#fff}
.podc .m{font-size:38px}
.podc b{display:block;font-size:17px;margin:6px 0 2px}
/* ranking */
.fl{display:flex;flex-wrap:wrap;gap:8px}
.fl button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:600;color:#334155}
.fl button.on{background:var(--blue2);border-color:#a9c0f5;color:var(--blue)}
.rtab{width:100%;border-collapse:collapse}
.rtab th{font-size:11px;letter-spacing:.12em;color:#64748b;text-align:left;padding:14px 16px;background:#f7f9fc;border-bottom:1px solid var(--line)}
.rtab td{padding:12px 16px;border-bottom:1px solid var(--line)}
.rtab tr.click{cursor:pointer}.rtab tr.click:hover td{background:#f9fbfe}
.rnum{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--blue2);color:var(--blue);font-weight:800}
.av{width:44px;height:44px;border-radius:50%;background:#eef2f8;border:1px solid var(--line);display:grid;place-items:center;color:#94a3b8;flex:none;font-weight:700}
.who{display:flex;gap:12px;align-items:center}
.who small{display:block;color:var(--mut);font-size:12.5px;text-transform:uppercase}
.med{display:flex;gap:14px;font-weight:700;white-space:nowrap}
/* profile */
.prof{display:flex;gap:22px;align-items:center;padding:24px;margin-bottom:16px;flex-wrap:wrap}
.bigav{width:110px;height:110px;border-radius:50%;background:linear-gradient(135deg,#dbeafe,#dcfce7);display:grid;place-items:center;font-size:38px;font-weight:800;color:var(--blue);border:4px solid #fff;box-shadow:0 6px 20px rgba(15,23,42,.12)}
.prof h2{font-size:30px}
.p2col{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.dl div{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.dl .dic{width:40px;height:40px;border-radius:10px;background:var(--blue2);color:var(--blue);display:grid;place-items:center;flex:none}
.dl small{color:var(--mut);display:block;font-size:12.5px}
.sumc{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.sumc .m{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.sumc b{font-size:22px;display:block}
/* modal */
#modal .bg{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:20px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal h3{font-size:20px;margin-bottom:4px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.setrow{display:grid;grid-template-columns:70px 1fr 20px 1fr;gap:8px;align-items:center;margin-bottom:10px}
.setrow .inp{text-align:center}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60}
#toast div{background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);margin-bottom:8px}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;padding:120px 20px;color:var(--mut)}
.spin{width:34px;height:34px;border:3px solid #dbe3f2;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pupl{display:flex;gap:14px;align-items:center}
.pupl .poster{width:110px;height:140px;border:2px dashed #cbd5e1;display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center}
.foot{display:flex;justify-content:space-between;color:var(--mut);font-size:12.5px;padding:18px 6px;flex-wrap:wrap;gap:8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:8px}
.chk input{width:18px;height:18px}
@media (max-width:820px){
 .ob{grid-template-columns:1fr}.obL{border-right:0;border-bottom:1px solid var(--line);padding:30px 20px}.obL h1{font-size:34px}.obR{padding:26px 20px}
 .tcard{grid-template-columns:96px 1fr;gap:12px}.poster{width:96px;height:124px}
 .tact{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px;flex-direction:row;flex-wrap:wrap}
 .tact .btn{flex:1}
 .meta{grid-template-columns:1fr;font-size:13.5px}
 .tinfo h3{font-size:15.5px}
 .dhero{grid-template-columns:1fr}.dhero .poster{height:240px;width:190px;margin:0 auto}
 .icards,.g2,.p2col,.dl,.pod{grid-template-columns:1fr}
 .pgrid{grid-template-columns:1fr 1fr}
 .hbtns .btn span{display:none}
 .brand small{display:none}
 .med{gap:8px;font-size:13px}
 .rtab th,.rtab td{padding:10px 8px}
 .bnav a{font-size:10.5px}
}
@media (max-width:520px){.pgrid{grid-template-columns:1fr}.tabs button{padding:10px 8px;font-size:13px}.ggrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);

/* ----- league ----- */
function rrRounds(ids){
 const a = [...ids]; if (a.length % 2) a.push(null);
 const n = a.length, rounds = [];
 for (let r = 0; r < n - 1; r++) {
  const rd = [];
  for (let i = 0; i < n / 2; i++) { const x = a[i], y = a[n - 1 - i]; if (x && y) rd.push([x, y]); }
  rounds.push(rd); a.splice(1, 0, a.pop());
 }
 return rounds;
}
function schedule(list, courts, mins, start, date){
 courts = Math.max(1, +courts || 1); mins = Math.max(5, +mins || 20);
 list.forEach((m, i) => { m.court = (i % courts) + 1; m.time = addMin(start, Math.floor(i / courts) * mins); m.date = date || ''; });
 return addMin(start, Math.ceil(list.length / courts) * mins);
}
function genLeague(t, c, ents, o){
 const ids = shuffle(ents.map(e => e.id));
 const G = Math.max(1, Math.min(+o.groups || 1, Math.floor(ids.length / 2) || 1));
 const groups = Array.from({length:G}, (_, i) => ({name:String.fromCharCode(65 + i), ids:[]}));
 ids.forEach((id, i) => { const r = Math.floor(i / G), k = r % 2 ? G - 1 - (i % G) : i % G; groups[k].ids.push(id); });
 const perG = groups.map(g => rrRounds(g.ids));
 const maxR = Math.max(0, ...perG.map(r => r.length));
 const matches = [];
 for (let r = 0; r < maxR; r++) perG.forEach((rounds, gi) => (rounds[r] || []).forEach(([a, b]) => matches.push({id:'G' + groups[gi].name + '_' + matches.length, g:groups[gi].name, a, b, sets:[], w:null})));
 schedule(matches, o.courts, o.mins, o.start || c.st || '08:00', c.sd);
 return {tid:t.id, cat:c.id, groups, matches, adv:+o.adv || 2, ko:null, courts:+o.courts || 1, mins:+o.mins || 20};
}
function standings(d, g){
 const rows = {}; g.ids.forEach(id => rows[id] = {id, w:0, l:0, pf:0, pa:0, p:0});
 const ms = d.matches.filter(m => m.g === g.name);
 ms.filter(m => m.w).forEach(m => {
  const [sa, sb] = pts(m.sets), A = rows[m.a], B = rows[m.b]; if (!A || !B) return;
  A.p++; B.p++; A.pf += sa; A.pa += sb; B.pf += sb; B.pa += sa;
  if (m.w === m.a) { A.w++; B.l++; } else { B.w++; A.l++; }
 });
 const h2h = (x, y) => { const m = ms.find(m => m.w && ((m.a === x.id && m.b === y.id) || (m.a === y.id && m.b === x.id))); return !m ? 0 : m.w === x.id ? -1 : 1; };
 const arr = Object.values(rows);
 arr.sort((x, y) => (y.w - x.w) || h2h(x, y) || ((y.pf - y.pa) - (x.pf - x.pa)) || (y.pf - x.pf));
 arr.forEach(r => { r.h = arr.filter(o => o !== r && o.w === r.w).length ? (arr.filter(o => o !== r && o.w === r.w).reduce((s, o) => s + (h2h(r, o) === -1 ? 1 : 0), 0)) : '-'; });
 return {rows:arr, done:ms.filter(m => m.w).length, total:ms.length};
}

/* ----- knockout ----- */
const nextPow2 = n => { let p = 2; while (p < n) p *= 2; return p; };
function seedOrder(n){ let o = [1]; while (o.length < n) { const m = o.length * 2; o = o.flatMap(s => [s, m + 1 - s]); } return o; }
function buildKO(qual, o, c, startOverride){
 const size = nextPow2(Math.max(2, qual.length));
 const seeds = seedOrder(size).map(s => qual[s - 1] ?? null);
 const ko = {size, seeds, res:{}, sched:{}};
 const tree = koTree(ko, c);
 const list = [];
 tree.rounds.forEach(rd => rd.forEach(m => { if (!(m.r === 0 && m.bye)) list.push(m); }));
 if (tree.bronze) list.splice(list.length - 1, 0, tree.bronze);
 const tmp = list.map(m => ({id:m.id}));
 schedule(tmp, o.courts, o.mins, startOverride || o.start || '08:00', c.sd);
 tmp.forEach(m => ko.sched[m.id] = {court:m.court, time:m.time, date:m.date});
 return ko;
}
function koTree(ko, c){
 if (!ko) return null;
 const R = Math.round(Math.log2(ko.size)), rounds = []; let prev = null;
 const mk = (id, r, m, a, b) => {
  const res = (ko.res || {})[id] || null, sc = (ko.sched || {})[id] || {};
  let winner;
  if (a === null && b !== undefined) winner = b;
  else if (b === null && a !== undefined) winner = a;
  else if (a && b && res && (res.w === a || res.w === b)) winner = res.w;
  const loser = (winner && a && b) ? (winner === a ? b : a) : undefined;
  return {id, r, m, a, b, res, winner, loser, bye:(a === null || b === null), court:(res && res.court) || sc.court, time:(res && res.time) || sc.time};
 };
 for (let r = 0; r < R; r++) {
  const n = ko.size >> (r + 1), rd = [];
  for (let m = 0; m < n; m++) {
   const a = r === 0 ? ko.seeds[2 * m] : prev[2 * m].winner;
   const b = r === 0 ? ko.seeds[2 * m + 1] : prev[2 * m + 1].winner;
   rd.push(mk(`K${r}_${m}`, r, m, a, b));
  }
  rounds.push(rd); prev = rd;
 }
 let bronze = null;
 if (c && c.bronze && R >= 2) { const sf = rounds[R - 2]; bronze = mk('BR', -1, 0, sf[0].loser, sf[1].loser); if (sf[0].bye || sf[1].bye) bronze = null; }
 return {rounds, bronze, R};
}
const roundName = (r, R) => { const k = R - r; return k === 1 ? 'AKHIR' : k === 2 ? 'SEPARUH AKHIR' : k === 3 ? 'SUKU AKHIR' : `PUSINGAN ${r + 1} (${Math.pow(2, k)} TERAKHIR)`; };

/* ----- podium & ranking ----- */
function podiumFor(d, c){
 if (!d || !c) return null;
 if (d.ko) {
  const tr = koTree(d.ko, c); const f = tr.rounds[tr.R - 1][0];
  if (!f.winner || !f.loser) return null;
  let bronze = [];
  if (tr.bronze && tr.bronze.winner) bronze = [tr.bronze.winner];
  else if (tr.R >= 2) bronze = tr.rounds[tr.R - 2].map(m => m.loser).filter(Boolean);
  return {gold:f.winner, silver:f.loser, bronze};
 }
 if (c.mt === 'L' && d.groups && d.groups.length === 1) {
  const st = standings(d, d.groups[0]);
  if (st.total && st.done === st.total) return {gold:st.rows[0]?.id, silver:st.rows[1]?.id, bronze:st.rows[2] ? [st.rows[2].id] : []};
 }
 return null;
}

  push(p.gold, 1); push(p.silver, 2); (p.bronze || []).forEach(b => push(b, 3));
 });

}

 if (!me()) return `<div class="wrap">${banner()}${vOnboard()}</div>`;
 let body = '';
 const v = S.view;
 if (v === 'ranking') body = vRanking();
 else if (v === 'athletes') body = vAthletes();
 else if (v === 'me') body = vMe();
 else if (v === 'create') body = vCreate();
 else if (v === 'admin') body = vAdmin();
 else if (v.startsWith('t-')) body = vT(v.slice(2));
 else body = vHome();
 return `<div class="wrap">${header()}${banner()}${body}<div class="foot"><span>© ${new Date().getFullYear()} SmashKu</span><span>${Object.keys(S.profiles).length} pengguna berdaftar · ${Object.keys(S.tournaments).length} kejohanan</span></div></div>${nav()}`;
}

/* ----- onboarding ----- */

 if (st.step === 'role') return `<div class="ob card"><div class="obL">${logo(120)}<h1>SmashKu</h1><p class="muted" style="max-width:340px">Sistem kejohanan badminton: pendaftaran, undian, liga, kalah mati dan ranking dalam satu tempat.</p>

 <button class="role blue" data-act="obrole" data-v="athlete"><span class="rico">${ic('user', 24)}</span><span><b>Atlet</b><span>Sertai kejohanan</span></span><span class="arr">${ic('arr')}</span></button>

 if (st.step === 'pin') return box(`${head('Selamat kembali', 'Masukkan PIN anda')}

 return box(`${head('Akaun baru', 'Lengkapkan profil anda')}

/* ----- home ----- */
function vHome(){
 const m = me(), all = tList();
 const myIds = new Set(myEntries().map(e => e.tid));
 const sets = {
  open: all.filter(t => !t.internal),
  mine: all.filter(t => isOrg(t) || myIds.has(t.id)),
  internal: all.filter(t => t.internal && (isOrg(t) || myIds.has(t.id)))
 };
 const cntActive = l => l.filter(t => t.status !== 'done').length;
 let list = sets[S.tab] || sets.open;
 if (S.fStatus === 'active') list = list.filter(t => t.status !== 'done');
 else if (S.fStatus === 'done') list = list.filter(t => t.status === 'done');
 if (S.fLevel) list = list.filter(t => (t.cats || []).some(c => c.level === S.fLevel));
 if (S.q) { const q = S.q.toLowerCase(); list = list.filter(t => (t.name + ' ' + t.venue).toLowerCase().includes(q)); }
 list.sort((a, b) => (a.status === 'done') - (b.status === 'done') || firstDate(a).localeCompare(firstDate(b)));
 const tb = (k, i, l, n) => `<button class="${S.tab === k ? 'on' : ''}" data-act="tab" data-v="${k}">${ic(i)} ${l} <span class="cnt">${n}</span></button>`;
 return `<div class="tabs">${tb('open','search','Kejohanan Terbuka',cntActive(sets.open))}${tb('mine','cal','Kejohanan Saya',sets.mine.length)}${tb('internal','users','Dalaman',sets.internal.length)}</div>
 <div class="card pad">
  <div class="srow"><div class="search">${ic('search')}<input id="q_home" placeholder="Cari kejohanan mengikut nama atau tempat" value="${esc(S.q)}" data-inp="q"></div></div>
  <div class="srow" style="flex-wrap:wrap">
   <select class="inp" style="width:auto" data-chg="fLevel"><option value="">Semua tahap</option>${Object.entries(LEVELS).map(([k, v]) => `<option value="${k}" ${S.fLevel === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
   <select class="inp" style="width:auto" data-chg="fStatus"><option value="active" ${S.fStatus === 'active' ? 'selected' : ''}>Aktif / akan datang</option><option value="done" ${S.fStatus === 'done' ? 'selected' : ''}>Sudah tamat</option><option value="all" ${S.fStatus === 'all' ? 'selected' : ''}>Semua</option></select>
   ${m.role === 'organizer' ? `<span style="flex:1"></span><button class="btn soft" data-act="testT">${ic('plus')} Cipta kejohanan ujian</button>` : ''}
  </div>
  <p class="muted" style="margin:6px 4px 14px">${list.length} kejohanan</p>
  ${list.length ? list.map(tCard).join('') : `<div class="empty"><div class="eico">${ic('trophy', 24)}</div><b>Tiada kejohanan</b>${S.tab === 'internal' ? 'Kejohanan dalaman yang anda anjurkan atau sertai akan muncul di sini.' : m.role === 'organizer' ? 'Tekan butang + Kejohanan di bawah untuk cipta yang pertama.' : 'Kejohanan baru akan muncul di sini apabila penganjur menerbitkannya.'}</div>`}
 </div>`;
}
function tCard(t){
 const cats = t.cats || [], n = entriesOf(t.id).length, slots = slotsOf(t), org = isOrg(t);
 const registered = myEntries().some(e => e.tid === t.id);
 let act = '';
 if (t.status === 'done') act = `<button class="btn soft sm" data-act="openT" data-id="${t.id}" data-tab="pairs">${ic('users', 16)} Pasangan</button><button class="btn soft sm" data-act="openT" data-id="${t.id}" data-tab="win">${ic('trophy', 16)} Keputusan</button>`;
 else {
  if (org) act += `<button class="btn grn" data-act="openT" data-id="${t.id}" data-tab="pairs">${ic('shield', 16)} Urus</button>`;
  if (!t.internal && t.status === 'open' && !org) act += registered ? `<span class="chip green" style="justify-content:center">${ic('check', 14)} Sudah daftar</span>` : (n < slots ? `<button class="btn pri" data-act="reg" data-id="${t.id}">${ic('edit', 16)} Daftar</button>` : `<span class="chip red" style="justify-content:center">Penuh</span>`);
  if (t.status === 'live' || t.status === 'prep') act += `<button class="btn soft sm" data-act="openT" data-id="${t.id}" data-tab="${(cats[0] || {}).mt === 'K' ? 'ko' : 'league'}">${ic('trophy', 16)} Tonton</button>`;
  if (!act) act = statusChip(t);
 }
 const lv = [...new Set(cats.map(c => LEVELS[c.level]))].join(', '), mt = [...new Set(cats.map(c => MTYPES[c.mt]))].join(', ');
 return `<div class="tcard" data-act="openT" data-id="${t.id}"><div class="poster">${posterImg(t)}</div>
 <div class="tinfo"><h3>${esc(t.name)}</h3><div class="meta">
  <span>${ic('cal')} ${esc(fmtD(firstDate(t)))}</span><span>${ic('pin')} ${esc(t.venue)}</span>
  <span>${ic('trophy')} ${esc(lv)} / ${esc(mt)}</span><span>${ic('users')} ${n}/${slots}</span>
  <span class="full">${ic('user')} ${esc(cats.map(c => CATS[c.cat]).join(', '))}</span></div>
  ${statusChip(t)} ${t.internal ? '<span class="chip green">Dalaman</span>' : ''}</div>
 <div class="tact">${act}</div></div>`;
}

}

/* ----- tournament detail ----- */
function vT(id){
 const t = S.tournaments[id] ? {...S.tournaments[id], id} : null;
 if (!t) return `<div class="card empty"><b>Kejohanan tidak dijumpai</b><a href="#home">Kembali ke utama</a></div>`;
 const cats = t.cats || [];
 if (!cats.find(c => c.id === S.tCat)) S.tCat = (cats[0] || {}).id;
 const c = cats.find(x => x.id === S.tCat) || {};
 const tabs = [['info','Maklumat','grid'], ['pairs','Pasangan','users'], ...(c.mt !== 'K' ? [['league','Liga','grid']] : []), ...(c.mt !== 'L' ? [['ko','Kalah Mati','trophy']] : []), ['win','Pemenang','trophy']];
 if (!tabs.find(x => x[0] === S.tTab)) S.tTab = 'info';
 const ents = entriesOf(t.id, c.id);
 let body = '';
 if (S.tTab === 'info') body = tInfo(t, c);
 else if (S.tTab === 'pairs') body = tPairs(t, c, ents);
 else if (S.tTab === 'league') body = tLeague(t, c, ents);
 else if (S.tTab === 'ko') body = tKO(t, c, ents);
 else body = tWin(t, c);
 return `<div style="margin-bottom:12px"><a href="#home" class="btn sm">${ic('back', 16)} Kembali</a></div>
 <div class="card dhero"><div class="poster">${posterImg(t, true)}</div><div>
  ${statusChip(t)} ${t.internal ? '<span class="chip green">Dalaman</span>' : '<span class="chip blue">Rasmi</span>'} ${isOrg(t) ? `<span class="chip green">${ic('shield', 13)} Anda penganjur</span>` : ''}
  <h2>${esc(t.name)}</h2><div class="muted">${ic('pin', 16)} ${esc(t.venue)}</div>
  <div class="muted" style="margin-top:6px">${ic('cal', 16)} ${esc(fmtD(firstDate(t)))} · ${ic('users', 16)} ${entriesOf(t.id).length}/${slotsOf(t)} penyertaan</div>
  ${cats.length > 1 ? `<div class="catchips">${cats.map(x => `<button class="${x.id === c.id ? 'on' : ''}" data-act="tCat" data-v="${x.id}">${esc(CATS[x.cat])} · ${esc(x.level)}</button>`).join('')}</div>` : `<div class="catchips"><span class="chip">${esc(CATS[c.cat])} · ${esc(LEVELS[c.level])} · ${esc(MTYPES[c.mt])}</span></div>`}
 </div></div>
 <div class="tabs">${tabs.map(([k, l, i]) => `<button class="${S.tTab === k ? 'on' : ''}" data-act="tTab" data-v="${k}">${ic(i)} ${l}</button>`).join('')}</div>
 ${body}`;
}
function tInfo(t, c){
 const org = isOrg(t), ents = entriesOf(t.id, c.id), paid = ents.filter(e => e.paid).length;
 const registered = myEntries().filter(e => e.tid === t.id);
 const op = S.profiles[t.org];
 let acts = '';
 if (!t.internal && t.status === 'open') acts += ents.length < (+c.slots || 0) ? `<button class="btn pri" data-act="reg" data-id="${t.id}">${ic('edit')} Daftar kategori ini</button>` : `<span class="chip red">Kategori penuh</span>`;

  const seen = new Set();

  Object.values(S.profiles).forEach(p => { if ((pkey(p.name).includes(q) || pkey(p.nick).includes(q)) && !seen.has(pkey(p.nick)) && !seen.has(pkey(p.name))) { seen.add(pkey(p.nick)); res.push({name:p.nick || p.name, full:p.name, club:p.club, g:p.gender, m:[0, 0, 0]}); } });
  Object.values(S.entries).forEach(e => [e.p1, e.p2].forEach(n => { if (n && pkey(n).includes(q) && !seen.has(pkey(n))) { seen.add(pkey(n)); res.push({name:n, club:e.club, g:'', m:[0, 0, 0]}); } }));
 }

 const regs = myEntries();
 const d = (i, l, v) => `<div><span class="dic">${ic(i)}</span><span><small>${l}</small><b>${esc(v || '-')}</b></span></div>`;

 <div class="acts"><button class="btn pri" data-act="editProfile">${ic('edit')} Edit profil</button><button class="btn" data-act="switchRole">${ic('swap')} Tukar ke ${m.role === 'organizer' ? 'Atlet' : 'Penganjur'}</button>${m.admin ? `<a class="btn soft" href="#admin">${ic('shield')} Halaman Admin</a>` : ''}<button class="btn danger" data-act="logout">${ic('back')} Log keluar</button></div></div>
 <div class="p2col"><div>
  <div class="card pad" style="margin-bottom:16px"><div class="eyebrow">Akaun</div><h3 style="margin:4px 0 6px">Butiran peribadi</h3>
   <div class="dl">${d('user', 'Nama penuh', m.name)}${d('id', 'Nama panggilan', m.nick)}${d('phone', 'No. telefon', m.phone)}${d('users', 'Jantina', m.gender === 'W' ? 'Perempuan' : 'Lelaki')}${d('shield', 'Kelab', m.club)}${d('globe', 'Peranan', m.role === 'organizer' ? 'Penganjur' : 'Atlet')}</div></div>
  <div class="card" style="overflow:hidden;margin-bottom:16px"><div class="pad" style="background:#fafbfd;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><div><div class="eyebrow">Pencapaian</div><h3>Rekod podium kejohanan</h3></div><span class="chip">${uniq.length}</span></div>
   ${uniq.length ? `<table class="rtab"><tbody>${uniq.map(x => `<tr class="click" data-act="openT" data-id="${x.t.id}"><td style="font-size:26px;width:50px">${['🥇','🥈','🥉'][x.place - 1]}</td><td><b>${esc(x.t.name)}</b><br><span class="muted" style="font-size:13px">${esc(CATS[x.c.cat])} · ${esc(LEVELS[x.c.level])} · ${esc(eName(x.id))}</span></td></tr>`).join('')}</tbody></table>` : `<div class="empty"><b>Belum ada podium</b>Pencapaian akan dipaparkan di sini (dipadankan dengan nama/nama panggilan anda).</div>`}</div>
  <div class="card" style="overflow:hidden"><div class="pad" style="background:#fafbfd;border-bottom:1px solid var(--line)"><div class="eyebrow">Pendaftaran saya</div><h3>Penyertaan yang anda hantar</h3></div>
   ${regs.length ? `<table class="rtab"><tbody>${regs.map(e => { const t = S.tournaments[e.tid]; const c = t && (t.cats || []).find(x => x.id === e.cat); return t ? `<tr class="click" data-act="openT" data-id="${e.tid}" data-tab="pairs"><td><b>${esc(t.name)}</b><br><span class="muted" style="font-size:13px">${esc(c ? CATS[c.cat] : '')} · ${esc(e.p2 ? e.p1 + '/' + e.p2 : e.p1)}</span></td><td><span class="chip ${e.paid ? 'green' : 'red'}">${e.paid ? 'Sudah bayar' : 'Belum bayar'}</span></td></tr>` : ''; }).join('')}</tbody></table>` : `<div class="empty"><b>Tiada pendaftaran</b>Daftar kejohanan dari halaman Utama.</div>`}</div>
 </div><div><div class="card pad"><div class="eyebrow">Sekilas pandang</div><h3 style="margin:4px 0 14px">Ringkasan podium</h3>
  <div class="sumc"><span class="m" style="background:#fef9c3">🥇</span><div><b>${cnt[0]}</b><span class="muted">Emas</span></div></div>
  <div class="sumc"><span class="m" style="background:#f1f5f9">🥈</span><div><b>${cnt[1]}</b><span class="muted">Perak</span></div></div>
  <div class="sumc"><span class="m" style="background:#ffedd5">🥉</span><div><b>${cnt[2]}</b><span class="muted">Gangsa</span></div></div></div></div></div>`;

/* ================= modal & toast ================= */
function openModal(html){ $('#modal').innerHTML = `<div class="bg" data-act="mbg"><div class="box">${html}</div></div>`; }
function closeModal(){ $('#modal').innerHTML = ''; S.mctx = null; }
function toast(msg){ const d = document.createElement('div'); d.textContent = msg; $('#toast').appendChild(d); setTimeout(() => d.remove(), 3200); }
function askConfirm(msg, fn, label){ S.confirmFn = fn; openModal(`<h3>Pasti?</h3><p class="muted">${esc(msg)}</p><div class="mfoot"><button class="btn" data-act="mclose">Batal</button><button class="btn danger" data-act="confirmYes">${esc(label || 'Ya, teruskan')}</button></div>`); }

function pairModal(t, entry, byOrg){
 const m = me(), cats = (t.cats || []);
 const e = entry || {cat:S.tCat && cats.find(c => c.id === S.tCat) ? S.tCat : (cats[0] || {}).id, p1:byOrg ? '' : (m.nick || m.name), p2:'', club:byOrg ? '' : m.club, phone:byOrg ? '' : m.phone};
 S.mctx = {type:'pair', tid:t.id, eid:entry ? entry.id : null, byOrg};
 const opts = cats.map(c => { const n = entriesOf(t.id, c.id).length; const full = n >= (+c.slots || 0) && !(entry && entry.cat === c.id); return `<option value="${c.id}" ${e.cat === c.id ? 'selected' : ''} ${full && !byOrg ? 'disabled' : ''}>${esc(CATS[c.cat])} · ${esc(c.level)} (${n}/${esc(c.slots)})${c.fee ? ' · RM' + esc(c.fee) : ''}${full ? ' — PENUH' : ''}</option>`; }).join('');
 openModal(`<div class="eyebrow">${entry ? 'Edit pasangan' : byOrg ? 'Tambah pasangan' : 'Daftar kejohanan'}</div><h3>${esc(t.name)}</h3><p class="muted" style="margin-top:0">${esc(t.venue)}</p>
 <div class="fld"><label>Kategori</label><select class="inp" id="pm_cat" data-chg="pmCat">${opts}</select></div>
 <div class="g2"><div class="fld"><label>Pemain 1 <i>*</i></label><input class="inp" id="pm_p1" value="${esc(e.p1)}" placeholder="Nama / nama panggilan"></div>
 <div class="fld" id="pm_p2wrap"><label>Pemain 2 <i>*</i></label><input class="inp" id="pm_p2" value="${esc(e.p2)}" placeholder="Nama pasangan"></div></div>
 <div class="g2"><div class="fld"><label>Kelab / Pasukan</label><input class="inp" id="pm_club" value="${esc(e.club)}"></div><div class="fld"><label>No. telefon untuk dihubungi</label><input class="inp" id="pm_phone" value="${esc(e.phone)}" inputmode="tel"></div></div>
 ${!byOrg && !entry ? '<p class="muted" style="font-size:13px">Status bayaran akan ditanda oleh penganjur selepas yuran diterima.</p>' : ''}
 <div class="mfoot">${entry ? `<button class="btn danger" data-act="delPair" style="margin-right:auto">${ic('trash', 15)} Padam</button>` : ''}<button class="btn" data-act="mclose">Batal</button><button class="btn pri" data-act="savePair">${ic('check')} Simpan</button></div>`);
 syncP2();
}
function syncP2(){ const sel = $('#pm_cat'); if (!sel || !S.mctx) return; const t = S.tournaments[S.mctx.tid]; const c = (t.cats || []).find(x => x.id === sel.value); const w = $('#pm_p2wrap'); if (w) w.style.display = c && isSingles(c.cat) ? 'none' : ''; }

function scoreModal(tid, cid, kind, ref){
 const d = S.draws[drawKey(tid, cid)]; if (!d) return;
 let a, b, sets, court, time;
 if (kind === 'g') { const m = d.matches[+ref]; if (!m) return; ({a, b, sets, court, time} = m); }
 else { const t = S.tournaments[tid]; const c = (t.cats || []).find(x => x.id === cid); const tr = koTree(d.ko, c); const m = ref === 'BR' ? tr.bronze : tr.rounds.flat().find(x => x.id === ref); if (!m || !m.a || !m.b) return; a = m.a; b = m.b; sets = (m.res && m.res.sets) || []; court = m.court; time = m.time; }
 S.mctx = {type:'score', tid, cid, kind, ref, a, b};
 const row = i => `<div class="setrow"><b>Set ${i + 1}</b><input class="inp" id="s${i}a" type="number" min="0" max="30" inputmode="numeric" value="${sets && sets[i] ? sets[i][0] : ''}"><span style="text-align:center">-</span><input class="inp" id="s${i}b" type="number" min="0" max="30" inputmode="numeric" value="${sets && sets[i] ? sets[i][1] : ''}"></div>`;
 openModal(`<div class="eyebrow">Masukkan skor</div><h3 style="margin-bottom:14px">${esc(eName(a))} <span class="muted">vs</span> ${esc(eName(b))}</h3>
 <div class="setrow" style="font-size:12px;color:var(--mut)"><span></span><span style="text-align:center">${esc(eName(a))}</span><span></span><span style="text-align:center">${esc(eName(b))}</span></div>
 ${row(0)}${row(1)}${row(2)}
 <div class="g2"><div class="fld"><label>Gelanggang</label><input class="inp" id="s_court" value="${esc(court || '')}"></div><div class="fld"><label>Masa</label><input class="inp" type="time" id="s_time" value="${esc(time || '')}"></div></div>
 <p class="muted" style="font-size:12.5px;margin-top:0">Format standard: 3 set, 21 mata. Pemenang ditentukan oleh bilangan set dimenangi.</p>
 <div class="mfoot">${sets && sets.length ? `<button class="btn danger" data-act="clrScore" style="margin-right:auto">Kosongkan</button>` : ''}<button class="btn" data-act="mclose">Batal</button><button class="btn pri" data-act="saveScore">${ic('check')} Simpan skor</button></div>`);
}

/* ================= actions ================= */
function readProfile(){ return {name:$('#pf_name').value.trim(), nick:$('#pf_nick').value.trim(), gender:$('#pf_gender').value, club:$('#pf_club').value.trim()}; }
function setPath(obj, path, val){ const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
const guard = () => { if (!S.canWrite) { toast('Anda hanya boleh melihat halaman ini.'); return false; } return true; };

const A = {
 obrole(d, el, ev){ ev.preventDefault(); S.ob = d.v ? {step:'phone', role:d.v, phone:(S.ob && S.ob.phone) || ''} : {step:'role'}; render(); },
 obStep(d){ S.ob.step = d.v; render(); },
 async obPhone(el){
  const ph = $('#ob_phone').value.trim(); if (normPhone(ph).length < 9) return toast('Masukkan nombor telefon yang sah.');
  S.ob.phone = ph;
  try { const ex = await rpc('bm_phone_exists', {p_phone:ph}); S.ob.step = ex ? 'pin' : 'reg'; render(); } catch(e){ toast(errMsg(e)); }
 },
 async obLogin(){
  const pin = $('#ob_pin').value.trim(); if (!/^\d{6}$/.test(pin)) return toast('PIN mesti 6 digit.');
  try { const r = await rpc('bm_login', {p_phone:S.ob.phone, p_pin:pin}); if (r && r.error) throw {message:r.error}; await afterAuth(r); toast('Selamat datang, ' + r.me.nick + '!'); } catch(e){ toast(errMsg(e)); }
 },
 async obReg(){
  const p = readProfile(), pin = $('#ob_pin').value.trim(), pin2 = $('#ob_pin2').value.trim();
  if (!p.name || !p.nick) return toast('Isi nama penuh dan nama panggilan.');
  if (!/^\d{6}$/.test(pin)) return toast('PIN mesti 6 digit nombor.'); if (pin !== pin2) return toast('PIN tidak sama.');
  try { const r = await rpc('bm_register', {p_phone:S.ob.phone, p_pin:pin, p_name:p.name, p_nick:p.nick, p_gender:p.gender, p_club:p.club, p_role:S.ob.role}); await afterAuth(r); toast('Akaun dicipta. Selamat datang!'); } catch(e){ toast(errMsg(e)); }
 },
 editProfile(){ const m = me(); openModal(`<div class="eyebrow">Akaun</div><h3 style="margin-bottom:14px">Edit profil</h3>${profileFields(m)}<div class="fld"><label>Tukar PIN (pilihan)</label><input class="inp" id="pf_pin" type="password" inputmode="numeric" maxlength="6" placeholder="Biarkan kosong jika tidak tukar"></div><div class="mfoot"><button class="btn" data-act="mclose">Batal</button><button class="btn pri" data-act="saveProfile2">Simpan</button></div>`); },
 saveProfile2(){ const p = readProfile(); if (!p.name || !p.nick) return toast('Isi nama penuh dan nama panggilan.'); const pin = $('#pf_pin').value.trim(); if (pin && !/^\d{6}$/.test(pin)) return toast('PIN mesti 6 digit.'); if (pin) p.pin = pin; delete p.phone; save('profiles', S.uid, p).then(() => { closeModal(); toast('Profil dikemas kini.'); }); },
 switchRole(){ const m = me(); const role = m.role === 'organizer' ? 'athlete' : 'organizer'; save('profiles', S.uid, {role}).then(() => toast('Peranan: ' + (role === 'organizer' ? 'Penganjur' : 'Atlet'))); },
 logout(){ askConfirm('Log keluar daripada akaun ini?', async () => { try { await rpc('bm_logout', {p_token:TOKEN}); } catch(e){} setToken(null); S.uid = null; S.meData = null; S.ob = {step:'role'}; location.hash = 'home'; render(); }, 'Log keluar'); },
 reload(d, el, ev){ ev.preventDefault(); loadAll(); },
 admSearch(){ S.adm.q = $('#adm_q').value.trim(); adminLoad(); },
 admPin(d){

  S.mctx = {type:'admpin', p};
  openModal(`<div class="eyebrow">Set semula PIN</div><h3>${esc(p.name)}</h3><p class="muted" style="margin-top:2px">${esc(p.nick)} · +${esc(p.phone)}</p>
  <div class="fld"><label>PIN baru (6 digit)</label><div class="srow" style="margin:0"><input class="inp" id="adm_pin" inputmode="numeric" maxlength="6" style="letter-spacing:.3em;font-size:20px;text-align:center" value="${String(Math.floor(100000 + Math.random() * 900000))}"><button class="btn" data-act="admRand">Jana rawak</button></div></div>

 },

 async admPinSave(){

   await rpc('bm_admin_set_pin', {p_token:TOKEN, p_player:x.p.id, p_pin:pin});

   openModal(`<div style="text-align:center"><div class="eico" style="width:56px;height:56px;border-radius:16px;background:var(--green2);color:var(--green);display:grid;place-items:center;margin:0 auto 12px">${ic('check', 26)}</div><h3>PIN berjaya diset</h3><p class="muted">${esc(x.p.name)} · +${esc(x.p.phone)}</p><div style="font-size:34px;font-weight:800;letter-spacing:.3em;margin:12px 0">${esc(pin)}</div></div>
   <div class="mfoot" style="justify-content:center"><a class="btn grn" href="https://wa.me/${esc(x.p.phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${ic('phone')} Hantar melalui WhatsApp</a><button class="btn" data-act="mclose">Tutup</button></div>`);
   adminLoad();
  } catch(e){ toast(errMsg(e)); }
 },

 guide, mclose: closeModal, mbg(d, el, ev){ if (ev.target === el) closeModal(); },

 },

 addCat(){ S.create.cats.push(newCat()); render(); },
 delCat(d){ S.create.cats.splice(+d.i, 1); render(); },

 saveT(){

 genKL(d){

 score(d){ const tid = S.view.slice(2); scoreModal(tid, S.tCat, d.kind, d.ref); },

 testT(){

function writeScore(clear){
 const x = S.mctx; if (!x || !guard()) return;
 const sets = [];
 if (!clear) for (let i = 0; i < 3; i++) { const a = $('#s' + i + 'a').value, b = $('#s' + i + 'b').value; if (a === '' && b === '') continue; if (a === '' || b === '') return toast('Lengkapkan skor set ' + (i + 1) + '.'); if (+a === +b) return toast('Set ' + (i + 1) + ' tidak boleh seri.'); sets.push([+a, +b]); }
 let w = null;
 if (!clear) { const wa = sets.filter(s => s[0] > s[1]).length, wb = sets.filter(s => s[1] > s[0]).length; if (!sets.length) return toast('Masukkan sekurang-kurangnya satu set.'); if (wa === wb) return toast('Mesti ada pemenang (contoh 2-1 set).'); w = wa > wb ? x.a : x.b; }
 const court = $('#s_court').value.trim(), time = $('#s_time').value;
 const k = drawKey(x.tid, x.cid); const dr = clone(S.draws[k]);
 if (x.kind === 'g') { const m = dr.matches[+x.ref]; m.sets = sets; m.w = w; m.court = court; m.time = time; }
 else { dr.ko.res = dr.ko.res || {}; if (clear) delete dr.ko.res[x.ref]; else dr.ko.res[x.ref] = {sets, w, court, time}; }
 save('draws', k, dr).then(() => {
  closeModal(); toast(clear ? 'Skor dikosongkan.' : 'Skor disimpan.');
  const t = S.tournaments[x.tid], c = t && (t.cats || []).find(z => z.id === x.cid);
  if (t && c && !clear && t.status !== 'done') { const all = t.cats.every(cc => podiumFor(S.draws[drawKey(x.tid, cc.id)], cc)); if (all) save('tournaments', x.tid, {...clone(t), status:'done'}).then(() => toast('Semua final selesai. Kejohanan ditanda Tamat.')); }
 });
}
const CHG = {
 fLevel(el){ S.fLevel = el.value; render(); }, fStatus(el){ S.fStatus = el.value; render(); },

/* ================= events ================= */
document.addEventListener('click', ev => {
 const el = ev.target.closest('[data-act]'); if (!el) return;
 const fn = A[el.dataset.act]; if (!fn) return;
 if (el.tagName === 'A' || el.tagName === 'BUTTON') ev.preventDefault();
 ev.stopPropagation();
 fn(el.dataset, el, ev);
});
document.addEventListener('keydown', ev => { if (ev.key !== 'Enter') return; const id = ev.target.id; if (id === 'ob_phone') A.obPhone(); else if (id === 'ob_pin' && S.ob && S.ob.step === 'pin') A.obLogin(); else if (id === 'adm_q') A.admSearch(); });
document.addEventListener('input', ev => {
 const el = ev.target;
 if (el.dataset.inp) { S[el.dataset.inp] = el.value; render(); return; }
 if (el.dataset.bind && S.create) { setPath(S.create, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value); }
});
document.addEventListener('change', ev => {
 const el = ev.target;
 if (el.dataset.chg && CHG[el.dataset.chg]) return CHG[el.dataset.chg](el);
 if (el.dataset.bind && S.create) setPath(S.create, el.dataset.bind, el.type === 'checkbox' ? el.checked : el.value);
 if (el.id === 'posterIn' && el.files && el.files[0]) loadPoster(el.files[0]);
});
function loadPoster(file){
 const img = new Image(), url = URL.createObjectURL(file);
 img.onload = () => {
  const max = 640, r = Math.min(1, max / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * r); cv.height = Math.round(img.height * r);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  let q = .75, data = cv.toDataURL('image/jpeg', q);
  while (data.length > 160000 && q > .3) { q -= .1; data = cv.toDataURL('image/jpeg', q); }
  URL.revokeObjectURL(url); S.create.poster = data; render();
 };
 img.onerror = () => toast('Gambar tidak dapat dibaca.');
 img.src = url;
}

/* ================= render & routing ================= */
function render(){
 const ae = document.activeElement, key = ae && ae.id && $('#app').contains(ae) ? ae.id : null;
 let ss = null, se = null; try { ss = ae.selectionStart; se = ae.selectionEnd; } catch(e){}
 $('#app').innerHTML = view();
 if (key) { const el = document.getElementById(key); if (el) { el.focus(); try { if (ss !== null) el.setSelectionRange(ss, se); } catch(e){} } }
}
function route(){
 const h = (location.hash || '').slice(1) || 'home';
 if (h !== S.view) { if (h === 'admin') S.adm = null; if (h === 'create' && S.view !== 'create' && !(S.create && S.create._edit)) S.create = null; S.view = h; window.scrollTo(0, 0); }
 render();
}
window.addEventListener('hashchange', route);

async function afterAuth(r){
 setToken(r.token); S.meData = r.me; S.uid = r.me.id; S.profiles[S.uid] = r.me; S.ob = null; render();
}
async function init(){
 S.view = (location.hash || '').slice(1) || 'home';
 render();
 if (!window.supabase) { S.ready = true; S.slow = true; render(); return; }
 SB = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:false, autoRefreshToken:false}});
 if (TOKEN) { try { const m = await rpc('bm_me', {p_token:TOKEN}); S.meData = m; S.uid = m.id; } catch(e){ if (String(e.message || '').includes('SESI_TAMAT')) setToken(null); } }
 await loadAll();
 try {
  const ch = SB.channel('bm-live');
  ['bm_tournaments','bm_entries','bm_draws'].forEach(tb => ch.on('postgres_changes', {event:'*', schema:'public', table:tb}, reloadSoon));
  ch.subscribe();
 } catch(e){}
 setInterval(() => { if (document.visibilityState === 'visible') loadAll(); }, 30000);
 document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadAll(); });
}
init();
