<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import TikTok</title><style>body{font:15px system-ui;background:#101419;color:#eee;margin:0}main{max-width:720px;margin:auto;padding:16px}section,article{background:#20262e;border-radius:12px;padding:14px;margin:12px 0}input,textarea,button{font:inherit;box-sizing:border-box;max-width:100%;padding:8px}label{display:block;margin:8px 0}article input,textarea{width:100%}small{color:#b9c2cc}</style><main><h1>Import TikTok Lead</h1><small>Pratonton setempat. Tiada penyimpanan database.</small><section><label for="file">Fail CSV</label><input id="file" type="file" accept=".csv,text/csv"><label for="paste">Atau tampal teks screenshot (Live Text iPhone)</label><textarea id="paste" rows="5"></textarea><button id="read">Baca teks</button> <button id="clear">Kosongkan</button><p id="status" role="status"></p></section><div id="rows"></div></main><script src="js/tiktok-lead-import.js"></script><script src="js/tiktok-lead-review.js"></script><script src="js/tiktok-lead-screenshot-text.js"></script><script>
const el=id=>document.getElementById(id);let records=[],generation=0;
function summary(){el('status').textContent=records.length+' rekod · '+records.filter(r=>r.valid&&!r.duplicate).length+' sah dan unik';}
function render(){el('rows').replaceChildren();summary();records.forEach((r,i)=>{const a=document.createElement('article'),s=document.createElement('p');s.textContent=r.duplicate?'Pendua':r.valid?'Sah':'Perlu semakan';a.append(s);for(const [k,title] of Object.entries({name:'Nama',rawPhone:'Telefon',city:'Bandar',state:'Negeri',gender:'Jantina',occupation:'Pekerjaan',date:'Tarikh'})){const l=document.createElement('label'),input=document.createElement('input');l.textContent=title;input.value=r[k]||'';input.addEventListener('change',()=>{records=AdaTikTokReview.update(records,i,{[k]:input.value});render();});l.append(input);a.append(l);}el('rows').append(a);});}
function load(data){records=AdaTikTokReview.review(data);render();}
function fail(e){records=[];render();el('status').textContent=e.message;}
el('file').onchange=async()=>{const g=++generation,f=el('file').files[0];if(!f)return;try{if(f.size>5000000)throw Error('Maksimum 5 MB');const t=await f.text();if(g===generation)load(AdaTikTokImport.preview(t));}catch(e){if(g===generation)fail(e);}};
el('read').onclick=()=>{generation++;try{load(AdaTikTokScreenshotText.extract(el('paste').value));}catch(e){fail(e);}};
el('clear').onclick=()=>{generation++;records=[];el('file').value='';el('paste').value='';render();};
</script></html>
