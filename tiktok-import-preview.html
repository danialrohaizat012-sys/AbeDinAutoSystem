<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import TikTok | Pratonton</title><style>body{font:15px system-ui;background:#101419;color:#eee;margin:0}main{max-width:720px;margin:auto;padding:16px}section,article{background:#20262e;border-radius:12px;padding:14px;margin:12px 0}input,button{font:inherit;max-width:100%;box-sizing:border-box}button{padding:10px;border:0;border-radius:8px}label{display:block;margin:8px 0}small{color:#b9c2cc}p{overflow-wrap:anywhere}</style><main><h1>Import TikTok Lead</h1><small>Pratonton setempat sahaja. Tiada data dihantar atau disimpan.</small><section><label for="file">Pilih fail CSV TikTok</label><input id="file" type="file" accept=".csv,text/csv"><p id="status" role="status"></p><button id="clear">Kosongkan</button></section><div id="rows"></div></main><script src="js/tiktok-lead-import.js"></script><script>
const file=document.getElementById('file'),status=document.getElementById('status'),rows=document.getElementById('rows');let generation=0;
function clear(){generation++;file.value='';rows.replaceChildren();status.textContent='';}
document.getElementById('clear').addEventListener('click',clear);
file.addEventListener('change',async()=>{const current=++generation;rows.replaceChildren();status.textContent='';const f=file.files[0];if(!f)return;if(f.size>5000000){status.textContent='Fail melebihi 5 MB';return;}try{const data=AdaTikTokImport.preview(await f.text());if(current!==generation)return;const valid=data.filter(r=>r.valid&&!r.duplicate).length;status.textContent=data.length+' rekod · '+valid+' sah dan unik dalam fail';for(const r of data.slice(0,500)){const a=document.createElement('article');for(const value of [r.name||'Nama kosong',r.phone||r.rawPhone||'Telefon kosong',r.city,r.date,r.duplicate?'Pendua dalam fail':r.valid?'Sah':'Perlu semakan']){const p=document.createElement('p');p.textContent=value;a.append(p);}rows.append(a);}if(data.length>500)status.textContent+=' · Paparan 500 rekod pertama';}catch(e){if(current===generation)status.textContent=e.message;}});
</script></html>
