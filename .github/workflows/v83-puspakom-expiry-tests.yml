name: V83 Puspakom 120-Day Expiry
on:
  pull_request:
    paths:
      - 'app.html'
      - 'js/puspakom.js'
      - 'tests/v83-puspakom-expiry.test.cjs'
      - '.github/workflows/v83-puspakom-expiry-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  puspakom-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Puspakom module syntax
        run: node --check --input-type=module < js/puspakom.js
      - name: Run expiry regression tests
        run: node --test tests/v83-puspakom-expiry.test.cjs
