name: HR isolated SQL smoke
on:
  push:
    branches: [hr-sql-test-only]
    paths:
      - 'hr-sql-ci/**'
      - '.github/workflows/hr-sql-test-only.yml'
permissions:
  contents: read
jobs:
  payroll:
    if: github.ref == 'refs/heads/hr-sql-test-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_demo_only
          POSTGRES_DB: hr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hr_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run SQL and role checks against disposable database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: ci_demo_only
          PGDATABASE: hr_ci
        run: |
          psql -X -v ON_ERROR_STOP=1 -f hr-sql-ci/tests/payroll-db-smoke.sql
          echo 'Payroll SQL smoke passed'
