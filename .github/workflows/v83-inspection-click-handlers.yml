name: V83 Inspection Click Handlers
on:
  pull_request:
    paths:
      - 'app.html'
      - 'js/checklist.js'
      - 'tests/v83-inspection-click-handlers.test.cjs'
      - '.github/workflows/v83-inspection-click-handlers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspection-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check checklist JavaScript
        run: node --check --input-type=module < js/checklist.js
      - name: Simulate action clicks
        run: node --test tests/v83-inspection-click-handlers.test.cjs
