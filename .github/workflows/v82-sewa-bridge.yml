name: V82 Sewa Bridge Checks
on:
  pull_request:
    paths:
      - 'supabase/functions/sewa-bridge/**'
      - '.github/workflows/v82-sewa-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Role mapping tests
        run: deno test supabase/functions/sewa-bridge/role_test.ts supabase/functions/sewa-bridge/security_test.ts supabase/functions/sewa-bridge/role_event_test.ts supabase/functions/sewa-bridge/authority_transition_test.ts supabase/functions/sewa-bridge/event_signature_test.ts supabase/functions/sewa-bridge/authority_envelope_test.ts
      - name: Type check bridge
        run: deno check supabase/functions/sewa-bridge/index.ts
