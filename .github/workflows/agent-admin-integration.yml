name: Agent Admin Integration Check
on:
  push:
    branches: [main, test/catalogue-interest-toggle-20261123]
    paths:
      - app.html
      - js/admin-menu.js
      - js/agent-admin-panel.js
      - tests/agent-admin-integration.test.mjs
      - tests/agent-lead-contact.test.mjs
      - tests/agent-read-commission.test.mjs
      - tests/agent-admin-theme.test.mjs
      - tests/catalogue-interest-toggle.test.mjs
      - supabase/catalogue_interest_button_visibility_v1.sql
      - agent.html
      - supabase/functions/agent-portal-admin/index.ts
      - .github/workflows/agent-admin-integration.yml
  pull_request:
    paths:
      - .github/workflows/agent-admin-integration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Agent Network owner access and menu integration
        run: node --test tests/agent-admin-integration.test.mjs tests/agent-lead-contact.test.mjs tests/agent-read-commission.test.mjs tests/agent-admin-theme.test.mjs tests/catalogue-interest-toggle.test.mjs
      - name: Check live admin bundle after deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 20 -H "Cache-Control: no-cache" "https://abedinauto.my/app.html?admin=1&check=$GITHUB_SHA" -o /tmp/abedin-admin.html
          grep -Fq 'data-cloud-page="agents"' /tmp/abedin-admin.html
          grep -Fq "if(page==='agents')return p.role==='owner'&&p.enabled===true" /tmp/abedin-admin.html
          curl -fsSL --retry 2 --max-time 20 -H "Cache-Control: no-cache" "https://abedinauto.my/js/agent-admin-panel.js?check=$GITHUB_SHA" -o /tmp/abedin-agent-panel.js
          grep -Fq 'Permohonan Ejen' /tmp/abedin-agent-panel.js
          grep -Fq 'direct_inquiry_list' /tmp/abedin-agent-panel.js
          grep -Fq 'WhatsApp Pelanggan' /tmp/abedin-agent-panel.js
          grep -Fq 'lead_contact_list' /tmp/abedin-agent-panel.js
          grep -Fq -- '--ag-bg:#161b1e' /tmp/abedin-agent-panel.js
          grep -Fq 'html.ada-light .ada-agent-owner' /tmp/abedin-agent-panel.js
          grep -Fq 'commission_offer_set' /tmp/abedin-agent-panel.js
          grep -Fq 'ag-mini-head' /tmp/abedin-agent-panel.js
          curl -fsSL --retry 2 --max-time 20 -H 'Cache-Control: no-cache' "https://abedinauto.my/agent.html?check=$GITHUB_SHA" -o /tmp/abedin-agent.html
          grep -Fq 'WhatsApp Pelanggan' /tmp/abedin-agent.html
          grep -Fq 'customer_phone,status,lead_source' /tmp/abedin-agent.html
          grep -Fq 'Tandakan Sudah Baca' /tmp/abedin-agent.html
          grep -Fq 'Komisen cadangan ejen' /tmp/abedin-agent.html
          grep -Fq 'ada-interest-visibility-switch' /tmp/abedin-admin.html
          grep -Fq "showInterestButton&&publicStatus(v)" /tmp/abedin-admin.html
          echo "PASS: Owner Daftar Minat toggle and public UI condition deployed"
          echo "PASS: Agent module available on live admin hosting"
