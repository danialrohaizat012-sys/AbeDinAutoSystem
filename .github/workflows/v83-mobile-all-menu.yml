name: V83 Mobile All Menu
on:
  pull_request:
    paths:
      - 'app.html'
      - 'js/admin-menu.js'
      - 'tests/v83-mobile-all-menu.test.cjs'
      - '.github/workflows/v83-mobile-all-menu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check menu JavaScript syntax
        run: node --check --input-type=module < js/admin-menu.js
      - name: Run all-menu navigation tests
        run: node --test tests/v83-mobile-all-menu.test.cjs
