name: Agent Portal Production Smoke
on:
  push:
    branches: [main]
    paths:
      - agent.html
      - tests/agent-auth-visibility.test.mjs
      - agent-inquiry.html
      - app.html
      - agent-payout-verify.html
      - .github/workflows/agent-production-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify login-only dashboard visibility
        run: node --test tests/agent-auth-visibility.test.mjs
      - name: Verify deployed portal paths and content
        shell: bash
        run: |
          set -euo pipefail
          sleep 90 # tunggu GitHub Pages siap publish commit ini
          for path in agent.html agent-payout-verify.html; do
            url="https://abedinauto.my/$path"
            echo "Checking $url"
            curl --fail --location --silent --show-error --max-time 20 --retry 1 \
              -H 'Cache-Control: no-cache' --output /tmp/agent-check.html "$url?release=$GITHUB_SHA"
            grep -q 'AbeDin Auto' /tmp/agent-check.html
            if [ "$path" = "agent.html" ]; then
              grep -q 'Menunggu pengesahan oleh HR Aiman' /tmp/agent-check.html
              grep -q 'agent-portal-admin' /tmp/agent-check.html
              grep -Fq 'data-view="dashboard" id="dashboardTab" hidden' /tmp/agent-check.html
              grep -Fq "if(!sessionData?.session?.access_token)return null" /tmp/agent-check.html
              grep -q 'Stok Katalog Awam untuk Promosi' /tmp/agent-check.html
              grep -q 'Kongsi WhatsApp' /tmp/agent-check.html
              grep -q 'display_price' /tmp/agent-check.html
              grep -q 'Pendaftaran pelanggan melalui link ejen' /tmp/agent-check.html
              grep -q 'ownerDirectInquiries' /tmp/agent-check.html
              grep -q 'shareToken=body.share_token' /tmp/agent-check.html
            else
              grep -q 'Tarikh DAN masa pembayaran bank sebenar' /tmp/agent-check.html
              grep -q 'agent-payout-verifier' /tmp/agent-check.html
            fi
            echo "PASS: $path contains current production release"
          done
          echo "Checking customer enquiry page"
          curl --fail --location --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' --output /tmp/agent-enquiry.html \
            "https://abedinauto.my/agent-inquiry.html?release=$GITHUB_SHA"
          grep -q 'Hantar Pertanyaan' /tmp/agent-enquiry.html
          grep -q 'agent-public-inquiry' /tmp/agent-enquiry.html
          grep -q 'name="consent"' /tmp/agent-enquiry.html
          grep -Fq 'id="agentCode" name="ref" type="hidden"' /tmp/agent-enquiry.html
          grep -q 'a-f0-9' /tmp/agent-enquiry.html
          grep -Fq '[hidden]{display:none!important}' /tmp/agent-enquiry.html
          grep -Fq 'refCode,car,customer_name:' /tmp/agent-enquiry.html
          grep -q 'whatsappAfter' /tmp/agent-enquiry.html
          grep -q 'wa.me/601156366925' /tmp/agent-enquiry.html
          grep -q 'id="agentCode" name="ref"' /tmp/agent-enquiry.html
          grep -Fq "ref:refCode,car,customer_name:" /tmp/agent-enquiry.html
          grep -Fq "const refCode=\$('agentCode').value.trim();" /tmp/agent-enquiry.html
          echo "PASS: customer enquiry form served by production"
          echo "Checking public catalogue referral integration"
          curl --fail --location --silent --show-error --max-time 20 \
            -H 'Cache-Control: no-cache' --output /tmp/ada-public-app.html "https://abedinauto.my/app.html?car=ADA-TEST-INVALID&ref=TEST_AGENT&release=$GITHUB_SHA"
          grep -q 'agentReferralCode' /tmp/ada-public-app.html
          grep -q 'agentReferralSuffix' /tmp/ada-public-app.html
          grep -q 'ada-agent-enquiry-card' /tmp/ada-public-app.html
          if grep -q 'Kod rujukan ejen:' /tmp/ada-public-app.html; then
            echo 'FAIL: agent code visible in public WhatsApp message'; exit 1
          fi
          grep -q 'ada-agent-enquiry-detail' /tmp/ada-public-app.html
          grep -q 'Daftar Minat' /tmp/ada-public-app.html
          if grep -Fq "Daftar Minat'+(agentReferralCode?' · Ejen" /tmp/ada-public-app.html; then
            echo 'FAIL: agent identity displayed to buyer'; exit 1
          fi
          grep -Fq "agentReferralSuffix());openPublicCatalogue(id)" /tmp/ada-public-app.html || { echo 'Referral ID lost in navigation'; exit 1; }
          echo "PASS: public catalogue contains agent referral code support"
      - name: Verify protected Supabase functions reject unauthenticated calls
        shell: bash
        run: |
          set -euo pipefail
          for function in agent-portal-admin agent-payout-verifier agent-portal-catalog; do
            echo "Checking protected function: $function"
            if [ "$function" = "agent-portal-catalog" ]; then
              status=$(curl --location --silent --show-error --max-time 15 \
                --output /tmp/ada-auth-check --write-out '%{http_code}' \
                "https://buzpdyvvoiqgbeventwm.supabase.co/functions/v1/$function")
            else
              status=$(curl --location --silent --show-error --max-time 15 \
                --output /tmp/ada-auth-check --write-out '%{http_code}' \
                --request POST -H 'content-type: application/json' -d '{"action":"list"}' \
                "https://buzpdyvvoiqgbeventwm.supabase.co/functions/v1/$function")
            fi
            case "$status" in
              401|403) echo "PASS: $function rejects unsigned request (HTTP $status)" ;;
              *) echo "FAIL: $function returned HTTP $status without authentication"; exit 1 ;;
            esac
          done
