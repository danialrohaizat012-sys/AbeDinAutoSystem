async function loadStaffReport(){const target=$('staff-results');target.textContent='Memuatkan...';try{const {data,error}=await client.rpc('tiktok_staff_performance');if(error)throw error;target.replaceChildren();if(!data.length)target.textContent='Belum ada lead diagihkan';for(const r of data){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p');h.textContent=r.staff_name;p.textContent='Lead: '+r.total+' · Dihubungi: '+r.contacted+' · Berminat: '+r.interested+' · Selesai: '+r.closed+' · Tertunggak: '+r.overdue;const rate=document.createElement('small');rate.textContent='Kadar status dihubungi: '+(Number(r.total)?Math.round(100*Number(r.contacted)/Number(r.total)):0)+'%';a.append(h,p,rate);target.append(a);}}catch(e){target.textContent='Laporan gagal: '+e.message;}}$('staff-report').ontoggle=()=>{if($('staff-report').open&&!$('staff-report').hidden)loadStaffReport();};$('staff-refresh').onclick=loadStaffReport;async function loadMetrics(){const {data,error}=await client.rpc('tiktok_followup_summary');$('metrics').replaceChildren();if(error){$('metrics-status').textContent='Ringkasan gagal: '+error.message;return;}$('metrics-status').textContent='';const m=data?.[0];if(!m)return;for(const [k,label] of Object.entries({total:'Jumlah lead',new_leads:'Lead baharu',due_today:'Follow up hari ini',overdue:'Tertunggak',never_followed:'Belum ada catatan',upcoming:'Akan datang',interested:'Berminat',closed:'Selesai'})){const a=document.createElement('article'),v=document.createElement('strong'),t=document.createElement('small');v.textContent=String(m[k]??0);t.textContent=label;a.append(t,v);$('metrics').append(a);}}async function load(){if(busy)return;busy=true;$('refresh').disabled=true;$('next').disabled=true;$('list').replaceChildren();$('status').textContent='Memuatkan...';try{const {data:auth,error:ae}=await client.auth.getUser();if(ae||!auth?.user)throw Error('Sila log masuk melalui dashboard.');const {data:me,error:pe}=await client.from('profiles').select('id,full_name,role,enabled').eq('id',auth.user.id).single();if(pe||!me?.enabled||!['owner','sales_advisor'].includes(me.role))throw Error('Akses tidak dibenarkan');$('staff-report').hidden=me.role!=='owner';if(me.role!=='owner'){$('staff-report').open=false;$('staff-results').replaceChildren();}let staff=[me];if(me.role==='owner'){const {data:team,error:te}=await client.from('profiles').select('id,full_name,role,enabled').in('role',['owner','sales_advisor']).eq('enabled',true).order('full_name');if(te)throw te;staff=team;}await loadMetrics();let q=($('queue').value?client.rpc('tiktok_followup_queue',{p_filter:$('queue').value}):client.from('tiktok_leads')).select('id,name,phone,city,state,occupation,status,created_at,assigned_to');const term=$('search').value.trim().replace(/[^\p{L}\p{N}\s+]/gu,'');if(term){const digits=term.replace(/\D/g,'');if(/^\+?[\d\s]+$/.test(term)){q=q.ilike('phone','%'+(digits.startsWith('0')?'60'+digits.slice(1):digits)+'%');}else{q=q.ilike('name','%'+term+'%');}}if($('filter').value)q=q.eq('status',$('filter').value);const {data,error}=await q.order('created_at',{ascending:false}).order('id').range(page*50,page*50+49);if(error)throw error;$('status').textContent=data.length?'Halaman '+(page+1)+' · '+data.length+' rekod':'Tiada rekod pada halaman ini';$('next').hidden=data.length<50;$('prev').hidden=page===0;for(const r of data){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),s=document.createElement('select');h.textContent=r.name;p.textContent=[r.phone,r.city,r.state,r.occupation].filter(Boolean).join(' · ');s.setAttribute('aria-label','Status follow up');for(const [v,t] of Object.entries(states)){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o);}s.value=r.status;s.onchange=async()=>{s.disabled=true;try{const {data,error}=await client.from('tiktok_leads').update({status:s.value}).eq('id',r.id).select('id,status').single();if(error)throw error;r.status=data.status;$('status').textContent='Status disimpan';await loadMetrics();}catch(e){s.value=r.status;$('status').textContent='Gagal: '+e.message;}finally{s.disabled=false;}};a.append(h,p,s);const ownerLabel=document.createElement('p');ownerLabel.textContent='Staff: '+(staff.find(x=>x.id===r.assigned_to)?.full_name||'Belum ditetapkan / tidak aktif');a.append(ownerLabel);if(me.role==='owner'){const ass=document.createElement('select');ass.setAttribute('aria-label','Agih pelanggan kepada staff');const placeholder=document.createElement('option');placeholder.value='';placeholder.textContent='Pilih staff';placeholder.disabled=true;ass.append(placeholder);for(const person of staff){const o=document.createElement('option');o.value=person.id;o.textContent=person.full_name||'Staff';ass.append(o);}ass.value=staff.some(x=>x.id===r.assigned_to)?r.assigned_to:'';ass.onchange=async()=>{ass.disabled=true;try{const {data,error}=await client.from('tiktok_leads').update({assigned_to:ass.value}).eq('id',r.id).select('id,assigned_to').single();if(error)throw error;r.assigned_to=data.assigned_to;ownerLabel.textContent='Staff: '+(staff.find(x=>x.id===r.assigned_to)?.full_name||'Tidak aktif');$('status').textContent='Agihan disimpan';}catch(e){ass.value=staff.some(x=>x.id===r.assigned_to)?r.assigned_to:'';$('status').textContent='Agihan gagal: '+e.message;}finally{ass.disabled=false;}};a.append(ass);}if(/^\+601\d{8,9}$/.test(r.phone)){const w=document.createElement('a');w.href='https://wa.me/'+r.phone.slice(1);w.target='_blank';w.rel='noopener noreferrer';w.textContent='WhatsApp';a.append(' ',w);}const ed=document.createElement('details'),es=document.createElement('summary'),eb=document.createElement('button'),ef={};es.textContent='Edit maklumat';ed.append(es);for(const [k,t] of Object.entries({name:'Nama',phone:'Telefon',city:'Bandar',state:'Negeri',occupation:'Pekerjaan'})){const l=document.createElement('label'),i=document.createElement('input');l.textContent=t;l.style.display='block';i.value=r[k]||'';i.maxLength=k==='name'?200:100;i.style.cssText='display:block;width:100%;box-sizing:border-box;margin:4px 0 8px';ef[k]=i;l.append(i);ed.append(l);}eb.textContent='Simpan maklumat';ed.append(eb);eb.onclick=async()=>{const name=ef.name.value.trim();let ph=ef.phone.value.replace(/[\s()+.-]/g,'');if(ph.startsWith('0'))ph='60'+ph.slice(1);else if(/^1\d{8,9}$/.test(ph))ph='60'+ph;if(!name){$('status').textContent='Nama diperlukan';return;}if(!/^601\d{8,9}$/.test(ph)){$('status').textContent='Nombor telefon tidak sah';return;}eb.disabled=true;try{const upd={name,phone:'+'+ph,city:ef.city.value.trim()||null,state:ef.state.value.trim()||null,occupation:ef.occupation.value.trim()||null};const {data,error}=await client.from('tiktok_leads').update(upd).eq('id',r.id).select('id,name,phone,city,state,occupation').single();if(error)throw Error(error.code==='23505'?'Nombor ini sudah wujud pada lead lain':error.message);Object.assign(r,data);h.textContent=r.name;p.textContent=[r.phone,r.city,r.state,r.occupation].filter(Boolean).join(' · ');ef.phone.value=r.phone;$('status').textContent='Maklumat disimpan';}catch(e){$('status').textContent='Gagal: '+e.message;}finally{eb.disabled=false;}};a.append(ed);const details=document.createElement('details'),summary=document.createElement('summary'),history=document.createElement('div'),note=document.createElement('textarea'),due=document.createElement('input'),save=document.createElement('button');summary.textContent='Sejarah follow up';note.placeholder='Catatan follow up';note.maxLength=2000;due.type='datetime-local';due.setAttribute('aria-label','Tarikh follow up berikutnya');save.textContent='Simpan catatan';details.append(summary,history,note,due,save);a.append(details);async function loadHistory(){history.textContent='Memuatkan...';const {data,error}=await client.from('tiktok_lead_followups').select('note,created_at,created_by,next_followup_at').eq('lead_id',r.id).order('created_at',{ascending:false}).limit(30);history.replaceChildren();if(error){history.textContent='Sejarah belum tersedia: '+error.message;return;}if(!data.length)history.textContent='Tiada catatan';for(const item of data){const line=document.createElement('p');line.textContent=new Date(item.created_at).toLocaleString('ms-MY',{timeZone:'Asia/Kuala_Lumpur'})+' · '+(staff.find(x=>x.id===item.created_by)?.full_name||'Staff terdahulu')+' · '+item.note+(item.next_followup_at?' · Susulan: '+new Date(item.next_followup_at).toLocaleString('ms-MY',{timeZone:'Asia/Kuala_Lumpur'}):'');history.append(line);}}details.ontoggle=()=>{if(details.open)loadHistory();};save.onclick=async()=>{if(!note.value.trim())return;save.disabled=true;try{const {error}=await client.from('tiktok_lead_followups').insert({lead_id:r.id,note:note.value.trim(),next_followup_at:due.value?new Date(due.value.slice(0,16)+':00+08:00').toISOString():null});if(error)throw error;note.value='';due.value='';await loadHistory();await loadMetrics();}catch(e){$('status').textContent='Catatan gagal: '+e.message;}finally{save.disabled=false;}};$('list').append(a);}}catch(e){$('status').textContent=e.message;$('next').hidden=true;}finally{busy=false;$('refresh').disabled=false;$('next').disabled=false;}}
$('queue').onchange=()=>{if(!busy){page=0;load();}};$('apply').onclick=()=>{if(!busy){page=0;load();}};$('search').onkeydown=e=>{if(e.key==='Enter')$('apply').click();};$('prev').onclick=()=>{if(!busy&&page>0){page--;load();}};$('refresh').onclick=()=>{if(!busy){page=0;load();}};$('next').onclick=()=>{if(!busy){page++;load();}};client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('list').replaceChildren();$('metrics').replaceChildren();$('staff-report').hidden=true;$('staff-report').open=false;$('staff-results').replaceChildren();$('status').textContent='Sesi tamat. Sila log masuk.';}});load();
