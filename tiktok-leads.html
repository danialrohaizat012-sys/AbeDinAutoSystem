<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Lead</title><style>body{background:#101419;color:#eee;font:15px system-ui;margin:0}main{max-width:760px;margin:auto;padding:16px}article{background:#20262e;padding:14px;border-radius:12px;margin:10px 0}button,select,a,input{font:inherit;padding:8px;color:inherit;background:#303a46;border:1px solid #53606c;border-radius:8px}a{display:inline-block;text-decoration:none}p{overflow-wrap:anywhere}</style><main><h1>TikTok Lead</h1><a href="/app.html?admin=1">Dashboard</a> <a href="tiktok-import-preview.html">Import pelanggan</a> <button id="refresh">Refresh</button><p><input id="search" type="search" placeholder="Cari nama atau telefon" maxlength="100" aria-label="Cari pelanggan"><select id="filter" aria-label="Tapis status"><option value="">Semua status</option></select> <button id="apply">Cari</button></p><p id="status" role="status"></p><div id="list"></div><button id="prev" hidden>Halaman sebelumnya</button> <button id="next" hidden>Halaman seterusnya</button></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const client=createClient('https://buzpdyvvoiqgbeventwm.supabase.co','sb_publishable_zuuNipsMpalN_38SJwXpFA_MRzQ6eZ0');
const $=id=>document.getElementById(id),states={new:'Baharu',contacted:'Dihubungi',interested:'Berminat',closed:'Selesai',not_interested:'Tidak berminat'};let page=0,busy=false;for(const [v,t] of Object.entries(states)){const o=document.createElement('option');o.value=v;o.textContent=t;$('filter').append(o);}
async function load(){if(busy)return;busy=true;$('refresh').disabled=true;$('next').disabled=true;$('list').replaceChildren();$('status').textContent='Memuatkan...';try{const {data:auth,error:ae}=await client.auth.getUser();if(ae||!auth?.user)throw Error('Sila log masuk melalui dashboard.');let q=client.from('tiktok_leads').select('id,name,phone,city,state,occupation,status,created_at');const term=$('search').value.trim().replace(/[^\p{L}\p{N}\s+]/gu,'');if(term){const digits=term.replace(/\D/g,'');if(/^\+?[\d\s]+$/.test(term)){q=q.ilike('phone','%'+(digits.startsWith('0')?'60'+digits.slice(1):digits)+'%');}else{q=q.ilike('name','%'+term+'%');}}if($('filter').value)q=q.eq('status',$('filter').value);const {data,error}=await q.order('created_at',{ascending:false}).order('id').range(page*50,page*50+49);if(error)throw error;$('status').textContent=data.length?'Halaman '+(page+1)+' · '+data.length+' rekod':'Tiada rekod pada halaman ini';$('next').hidden=data.length<50;$('prev').hidden=page===0;for(const r of data){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),s=document.createElement('select');h.textContent=r.name;p.textContent=[r.phone,r.city,r.state,r.occupation].filter(Boolean).join(' · ');s.setAttribute('aria-label','Status follow up');for(const [v,t] of Object.entries(states)){const o=document.createElement('option');o.value=v;o.textContent=t;s.append(o);}s.value=r.status;s.onchange=async()=>{s.disabled=true;try{const {data,error}=await client.from('tiktok_leads').update({status:s.value}).eq('id',r.id).select('id,status').single();if(error)throw error;r.status=data.status;$('status').textContent='Status disimpan';}catch(e){s.value=r.status;$('status').textContent='Gagal: '+e.message;}finally{s.disabled=false;}};a.append(h,p,s);if(/^\+601\d{8,9}$/.test(r.phone)){const w=document.createElement('a');w.href='https://wa.me/'+r.phone.slice(1);w.target='_blank';w.rel='noopener noreferrer';w.textContent='WhatsApp';a.append(' ',w);}$('list').append(a);}}catch(e){$('status').textContent=e.message;$('next').hidden=true;}finally{busy=false;$('refresh').disabled=false;$('next').disabled=false;}}
$('apply').onclick=()=>{if(!busy){page=0;load();}};$('search').onkeydown=e=>{if(e.key==='Enter')$('apply').click();};$('prev').onclick=()=>{if(!busy&&page>0){page--;load();}};$('refresh').onclick=()=>{if(!busy){page=0;load();}};$('next').onclick=()=>{if(!busy){page++;load();}};client.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT'){$('list').replaceChildren();$('status').textContent='Sesi tamat. Sila log masuk.';}});load();
</script></html>
