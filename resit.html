<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resit Bayaran – Abe Din Auto</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta property="og:title" content="Resit Bayaran – Abe Din Auto">
<meta property="og:description" content="Terima kasih kerana memilih Abe Din Auto. Buka untuk melihat dan memuat turun PDF resit bayaran anda.">
<meta property="og:image" content="https://abedinauto.my/abe-din-logo.png">
<meta property="og:type" content="website">
<link rel="icon" href="icon-32.png">
<style>
/* Halaman pelanggan: lihat & muat turun PDF Resit Bayaran jualan kereta (pautan rahsia ?t=token). */
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0b0f10;color:#f4f1ea;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:24px 16px;padding-top:max(24px,env(safe-area-inset-top))}
.wrap{max-width:560px;margin:0 auto}
.card{background:#151a1b;border:1px solid #ffffff14;border-radius:20px;padding:22px 20px;text-align:center}
.logo{width:120px;height:auto;margin:0 auto 10px;display:block}
h1{margin:0 0 4px;font-size:20px;letter-spacing:.06em;color:#f5c400}
.sub{color:#9aa3a6;margin:0 0 16px;font-size:13.5px}
.rows{text-align:left;border-top:1px solid #ffffff12;margin-top:6px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid #ffffff12;font-size:14px}
.row span{color:#9aa3a6}.row b{text-align:right}
.ok{color:#3ecf8e}.due{color:#ff9f43}
.btns{display:grid;gap:10px;margin-top:18px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:800 15px inherit;font-family:inherit;cursor:pointer;text-decoration:none;text-align:center}
.pri{background:#f5c400;color:#141000}.sec{background:transparent;color:#f4f1ea;border:1px solid #ffffff2a}
.tip{font-size:12.5px;color:#8e979a;margin:12px 0 0}
.spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.2);border-top-color:#f5c400;border-radius:50%;animation:s .8s linear infinite;margin:18px auto 0}
@keyframes s{to{transform:rotate(360deg)}}
.prev{margin-top:16px;width:100%;height:74vh;border:0;border-radius:14px;background:#fff;display:none}
@media(min-width:760px){.wrap{max-width:820px}.prev{display:block}}
.foot{margin-top:16px;text-align:center;font-size:12px;color:#6b7478}
.foot a{color:#f5c400;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="card">
    <img class="logo" src="abe-din-logo.png" alt="Abe Din Auto">
    <h1>RESIT BAYARAN</h1>
    <p class="sub" id="msg">Memuatkan resit anda…</p>
    <div class="spin" id="spin"></div>
  </div>
  <div class="foot">Abe Din Auto · 011-5636 6925 · <a href="https://abedinauto.my">abedinauto.my</a></div>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { buildSaleReceiptPdf } from './js/resit-pdf.js?v=1';
const $ = id => document.getElementById(id);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rm = n => 'RM ' + Number(n || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fail = t => { $('msg').textContent = t; $('spin')?.remove(); };
const loadPdfLib = () => window.PDFLib ? Promise.resolve(window.PDFLib) : new Promise((ok, no) => { const s = document.createElement('script'); s.src = '/assets/vendor/pdf-lib.min.js'; s.onload = () => window.PDFLib ? ok(window.PDFLib) : no(new Error('PDF')); s.onerror = () => no(new Error('PDF')); document.head.appendChild(s); });
const tok = new URLSearchParams(location.search).get('t') || '';
if (!/^[0-9a-f-]{36}$/i.test(tok)) fail('Pautan resit tidak sah. Sila hubungi Abe Din Auto.');
else {
  try {
    const client = createClient('https://buzpdyvvoiqgbeventwm.supabase.co', 'sb_publishable_zuuNipsMpalN_38SJwXpFA_MRzQ6eZ0',
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: 'ada-resit' } });
    const { data, error } = await client.rpc('get_sale_receipt', { p_token: tok });
    if (error) fail('Resit tidak dapat dimuatkan. Sila cuba lagi atau hubungi Abe Din Auto.');
    else if (!data) fail('Resit tidak ditemui. Sila hubungi Abe Din Auto.');
    else {
      const x = data.sale, v = data.vehicle || {}, c = data.customer || {}, pays = data.payments || [];
      const PDFLib = await loadPdfLib();
      const { bytes, fname, no, paid, bal } = await buildSaleReceiptPdf(PDFLib, { x, v, c, pays });
      const blob = new Blob([bytes], { type: 'application/pdf' }), url = URL.createObjectURL(blob);
      const car = [v.model_year, v.make, v.model].filter(Boolean).join(' ');
      document.title = `Resit ${no} – Abe Din Auto`;
      $('card').innerHTML = `<img class="logo" src="abe-din-logo.png" alt="Abe Din Auto"><h1>RESIT BAYARAN</h1>
        <p class="sub">Terima kasih ${esc(c.full_name || '')} kerana memilih Abe Din Auto.</p>
        <div class="rows">
          <div class="row"><span>No. Resit</span><b>${esc(no)}</b></div>
          <div class="row"><span>Kenderaan</span><b>${esc(car)}${v.plate ? ' (' + esc(v.plate) + ')' : ''}</b></div>
          <div class="row"><span>Jumlah dibayar</span><b>${rm(paid)}</b></div>
          <div class="row"><span>Status</span><b class="${bal > 0 ? 'due' : 'ok'}">${bal > 0 ? 'Baki ' + rm(bal) : 'Bayaran selesai sepenuhnya ✓'}</b></div>
        </div>
        <div class="btns"><a class="btn pri" id="dl" href="${url}" download="${esc(fname)}">⬇ Muat Turun PDF</a><a class="btn sec" href="${url}" target="_blank" rel="noopener">📄 Lihat PDF</a></div>
        <p class="tip">Di iPhone: tekan <b>Lihat PDF</b>, kemudian Kongsi → Simpan ke Fail.</p>
        <iframe class="prev" src="${url}" title="Resit PDF"></iframe>`;
    }
  } catch (e) { fail('Resit tidak dapat dimuatkan. Sila cuba lagi atau hubungi Abe Din Auto.'); }
}
</script>
</body>
</html>
