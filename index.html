/* V3.5: fixed inventory image boundaries and readable information */
.cargrid{grid-template-columns:repeat(auto-fill,minmax(min(100%,245px),1fr));align-items:stretch}
.carcard{display:flex;flex-direction:column;min-width:0;isolation:isolate;overflow:hidden}
.carcard .carimage{position:relative;display:block;flex:none;width:100%;height:auto;aspect-ratio:16/10;min-height:0;max-height:none;overflow:hidden;background:#111819}
.carcard .carimage img{display:block;position:absolute;inset:0;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-position:center;filter:none;transform:none}
.carcard .carimage .tag{z-index:2;top:10px;left:10px}
.carcard .cardbody{display:flex;flex-direction:column;position:relative;z-index:1;flex:1;min-width:0;min-height:132px;padding:14px;background:linear-gradient(140deg,#202727,#131819);overflow-wrap:anywhere}
.carcard .cardbody strong{display:block;line-height:1.4;min-height:2.8em}
.carcard .cardbody .price{margin-top:auto;padding-top:8px}
.carcard .cardbody .meta{gap:8px;flex-wrap:wrap}
@media(max-width:700px){.cargrid{grid-template-columns:1fr}.carcard{display:grid;grid-template-columns:minmax(0,39%) minmax(0,1fr);min-height:145px}.carcard .carimage{width:100%;height:100%;min-height:145px;aspect-ratio:auto}.carcard .cardbody{min-height:145px;padding:12px}.carcard .cardbody strong{font-size:13px}.carcard .cardbody .price{font-size:17px}}
@media(max-width:360px){.carcard{grid-template-columns:minmax(0,36%) minmax(0,1fr)}.carcard .cardbody{padding:10px}.carcard .cardbody .meta{font-size:10px}}

async function addVehicle(e){e.preventDefault();let f=e.target,fd=new FormData(f),plate=String(fd.get('plate')).trim().toUpperCase();if(db.cars.some(c=>c.plate.toUpperCase()===plate)){flash('No. pendaftaran sudah wujud');return}let image='';let file=fd.get('image');if(file&&file.size){if(file.size>1000000){flash('Gambar melebihi 1MB');return}image=await new Promise(res=>{let r=new FileReader;r.onload=()=>res(r.result);r.readAsDataURL(file)})}let id='ADA-'+String(Math.max(0,...db.cars.map(c=>Number(c.id.split('-')[1])||0))+1).padStart(3,'0');db.cars.push({id,make:fd.get('make').trim(),model:fd.get('model').trim(),year:+fd.get('year'),plate,source:fd.get('source'),cost:+fd.get('cost'),price:+fd.get('price'),mileage:+fd.get('mileage'),status:fd.get('status'),notes:fd.get('notes'),checks:{},expenses:[],image});log('Kenderaan '+id+' didaftarkan');try{save();go('vehicle',id);flash('Kenderaan berjaya disimpan')}catch(err){db.cars.pop();flash('Storan peranti penuh. Cuba tanpa gambar.')}}function vehicle(){let c=car(selected);if(!c)return inventory();let sale=saleFor(c.id);return title('PROFIL KENDERAAN',`${esc(c.make)} ${esc(c.model)} ${esc(c.year)}`,`${esc(c.plate)} · ${esc(c.id)}`,tag(c.status))+`<div class="card">${c.image?`<img src="${c.image}" onerror="this.style.display='none'" style="width:100%;max-height:250px;object-fit:cover;border-radius:12px">`:'<div class="empty">🚘 Gambar belum dimuat naik</div>'}<div class="grid" style="margin-top:15px"><div><small class="muted">Harga jualan</small><h2 style="color:var(--gold2)">${fmt(c.price)}</h2></div><div><small class="muted">Perolehan</small><p>${esc(c.source)}</p></div><div><small class="muted">Mileage</small><p>${Number(c.mileage).toLocaleString()} km</p></div>${role==='Owner'?`<div><small class="muted">Kos perolehan</small><p>${fmt(c.cost)}</p></div><div><small class="muted">Kos persediaan</small><p>${fmt(expenses(c))}</p></div>`:''}</div><p>${esc(c.notes)}</p><div class="actions"><button class="ghost" onclick="go('ins d:f.method.value,date}]});c.status=paid===price?'Sold':'Reserved';log('Jualan '+c.id+' direkodkan');save();go('saledetail',id);flash('Jualan disimpan')}function saledetail(){let s=db.sales.find(x=>x.id===selected);if(!s)return sales();let c=car(s.carId),balance=Math.max(0,s.price-s.paid);return title('BUTIRAN JUALAN','Transaksi '+esc(s.id),`${esc(c?.make)} ${esc(c?.model)} · ${esc(c?.plate)}`)+`<div class="notice">Status: ${payState(s)} · Kenderaan: ${esc(c.status)}. Sold hanya selepas bayaran penuh diterima.</div><div class="grid"><div class="card"><div class="muted">Harga jualan</div><div class="metric" style="font-size:20px">${fmt(s.price)}</div></div><div class="card"><div class="muted">Diterima</div><div class="metric" style="font-size:20px">${fmt(s.paid)}</div></div><div class="card"><div class="muted">Baki</div><div class="metric" style="font-size:20px">${fmt(balance)}</div></div><div class="card"><div class="muted">Sales Advisor</div><p>${esc(s.advisor)}</p></div></div><section class="section card"><h2>Pelanggan</h2><p>${esc(s.customerName)}</p><h2>Rekod bayaran</h2>${s.payments.map(p=>`<p>${esc(p.date)} · ${esc(p.type||'Bayaran')} · ${esc(p.method||'Tidak dinyatakan')} · ${fmt(p.amount)}</p>`).join('')}${balance>0&&role!=='Staf Operasi'?`<form class="form" onsubmit="addPayment(event)"><label class="field">Bayaran baki penuh (RM)<input name="amount" type="number" min="0.01" max="${balance}" step="0.01" readonly value="${balance}"></label><label class="field">Kaedah<select name="method"><option>Bank transfer</option><option>Cash</option><option>Other</option></select></label><div class="field wide"><button class="btn">Sahkan bayaran penuh</button></div></form>`:''}<div class="actions"><button class="ghost" onclick="go('sales')">Kembali</button></div></section>`}function addPayment(e){e.preventDefault();if(role==='Staf Operasi')return;let s=db.sales.find(x=>x.id===selected),amount=+e.target.amount.value,balance=+(s.price-s.paid).toFixed(2);if(Math.abs(amount-balance)>0.001||balance<=0)return flash('Bayaran baki penuh diperlukan');s.paid=s.price;s.payments.push({amount,type:'Bayaran penuh (baki)',method:e.target.method.value,date:new Date().toLocaleString('ms-MY')});car(s.carId).status='Sold';log('Bayaran penuh '+s.carId+' diterima');save();render();flash('Bayaran penuh diterima; kereta Sold')}function reports(){if(role!=='Owner')return '<div class="notice">Laporan kewangan hanya untuk Owner.</div>';let total=db.sales.reduce((a,s)=>a+s.price,0),paid=db.sales.reduce((a,s)=>a+s.paid,0),owned=db.cars.filter(c=>c.source!=='Consignment'&&c.status!=='Sold').reduce((a,c)=>a+c.cost+expenses(c),0);return title('ANALITIK','Laporan Perniagaan','Nilai jualan berbeza daripada tunai diterima. Data demo pada peranti ini.')+`<div class="grid"><div class="card"><div class="muted">Nilai jualan direkod</div><div class="metric" style="font-size:21px">${fmt(total)}</div></div><div class="card"><div class="muted">Bayaran diterima</div><div class="metric" style="font-size:21px">${fmt(paid)}</div></div><div class="card"><div class="muted">Baki belum terima</div><div class="metric" style="font-size:21px">${fmt(total-paid)}</div></div><div class="card"><div class="muted">Kos stok milik sendiri*</div><div class="metric" style="font-size:21px">${fmt(owned)}</div></div></div><section class="section card"><h2>Kos & margin mengikut kenderaan</h2>${db.sales.map(s=>{let c=car(s.carId),cost=c.cost+expenses(c);return `<p><strong>${esc(c.plate)}</strong> · ${esc(c.source)}<br>Jualan ${fmt(s.price)} · Kos persediaan ${fmt(expenses(c))} · ${c.source==='Consignment'?'Margin belum boleh dikira tanpa nilai penyelesaian pemilik':'Margin anggaran '+fmt(s.price-cost)}</p>`}).join('')||'<p>Belum ada jualan.</p>'}</section><div class="notice">*Consignment dikecualikan daripada nilai stok milik sendiri. Margin anggaran belum mengambil kira semua kos, cukai atau komisen. Jangan anggap angka ini keuntungan bersih.</div>`}function settings(){return title('TETAPAN','Demo & Akses','Tukar peranan untuk menguji paparan prototaip.')+`<div class="card"><label class="field">Peranan Pengguna<select onchange="role=this.value;go('dashboard')">${['Owner','Sales Advisor','Staf Operasi'].map(r=>`<option ${role===r?'selected':''}>${r}</option>`).join('')}</select></label><div class="notice">DATA DEMO V3.5: 15 kenderaan contoh; nombor plat, mileage, kos belian dan keadaan kereta ialah simulasi. Gambar model daripada Wikimedia Commons memerlukan internet dan tidak menggambarkan stok sebenar. Kredit: Bezza &amp; Axia oleh Bindydad123 (CC BY-SA 4.0); Saga FLX oleh Aero777 (CC BY 3.0 / GFDL). Gantikan gambar dengan foto unit sebenar sebelum digunakan kepada pelanggan. Data V3.1 kekal berasingan dalam browser.</div><div class="notice">Pilihan peranan ini hanya simulasi UI, bukan kawalan keselamatan sebenar. Data sebenar memerlukan login, pangkalan data online dan peraturan akses pada server.</div><div class="actions"><button class="ghost" onclick="exportDemo()">Eksport Data Demo (JSON)</button><button class="ghost danger" onclick="resetDemo()">Reset Data Demo</button></div></div>`}function exportDemo(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='abe-din-auto-demo.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function resetDemo(){if(confirm('Reset semua data demo pada peranti ini?')){db=structuredClone(seed);save();go('dashboard');flash('Data demo telah direset')}}function render(){let visible=navs.filter(n=>role==='Owner'||(role==='Sales Advisor'?!['inspection','reports'].includes(n[0]):!['sales','customers','reports'].includes(n[0])));$('nav').innerHTML=visible.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');let bottom=visible.filter(n=>['dashboard','inventory','sales','customers','reports'].includes(n[0]));if(bottom.length<5)bottom.push(['settings','⚙','Lainnya']);$('bottom').innerHTML=bottom.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');let routes={dashboard,inventory,addcar,vehicle,editcar,inspection,customers,sales,newsale,saledetail,reports,settings};let html=(routes[page]||dashboard)();if(page==='vehicle'&&car(selected))html=vehicleGallery(car(selected))+html;$('main').innerHTML=html}
let wizardStep=0,draftCar=null,vehiclePhotoIndex=0,vehicleTab='Maklumat';
function cover(c){return (c.images&&c.images.length?c.images[c.coverIndex||0]||c.images[0]:c.image)||''}
function saveWizardFields(){let f=document.getElementById('vehicleWizard');if(!f)return;new FormData(f).forEach((v,k)=>{if(draftCar&&typeof v==='string')draftCar[k]=v})}
function nextCar(e){e.preventDefault();saveWizardFields();let plate=draftCar.plate.trim().toUpperCase();if(db.cars.some(c=>c.plate.toUpperCase()===plate)){flash('Nombor plat sudah didaftarkan');return}wizardStep=1;render()}
async function addCarPhotos(files){if(!draftCar)return;let items=Array.from(files);for(let file of items){if(draftCar.images.length>=10){flash('Maksimum 10 gambar');break}if(!file.type.startsWith('image/')){flash('Fail bukan gambar');continue}try{let data=await compressPhoto(file);draftCar.images.push(data)}catch(err){flash('Gambar gagal diproses: '+err.message)}}render()}
function compressPhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onerror=()=>reject(Error('Tidak boleh baca fail'));r.onload=()=>{let im=new Image();im.onerror=()=>reject(Error('Format gambar tidak disokong browser'));im.onload=()=>{let max=900,scale=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);resolve(cv.toDataURL('image/jpeg',.68))};im.src=r.result};r.readAsDataURL(file)})}
function removeCarPhoto(i){draftCar.images.splice(i,1);draftCar.coverIndex=Math.max(0,Math.min(draftCar.coverIndex||0,draftCar.images.length-1));render()}
function setCarCover(i){draftCar.coverIndex=i;render()}
function finishCar(e){e.preventDefault();saveWizardFields();if(role!=='Owner')return flash('Owner sahaja');let d=draftCar,plate=d.plate.trim().toUpperCase();if(!d.make.trim()||!d.model.trim()||!plate||!(+d.price>0))return flash('Lengkapkan maklumat wajib');if(db.cars.some(c=>c.plate.toUpperCase()===plate))return flash('Nombor plat sudah didaftarkan');let id='ADA-'+String(Math.max(0,...db.cars.map(c=>Number(c.id.split('-')[1])||0))+1).padStart(3,'0'),c={...d,id,plate,year:+d.year,cost:+d.cost||0,price:+d.price,mileage:+d.mileage||0,checks:{},expenses:[],image:d.images[d.coverIndex||0]||''};db.cars.push(c);log('Kenderaan '+id+' didaftarkan');try{save()}catch(err){db.cars.pop();return flash('Storan browser penuh. Eksport data atau kurangkan gambar.')}draftCar=null;wizardStep=0;go('vehicle',id);flash('Kenderaan berjaya disimpan')}
function changeVehiclePhoto(i){vehiclePhotoIndex=i;let im=document.getElementById('vehicleMainPhoto');if(im)im.src=(car(selected).images||[])[i]||cover(car(selected))}
function vehicleGallery(c){let imgs=c.images&&c.images.length?c.images:(c.image?[c.image]:[]);return `<div>${imgs.length?`<img id="vehicleMainPhoto" class="vhero" src="${imgs[Math.min(vehiclePhotoIndex,imgs.length-1)]}" alt="${esc(c.make)} ${esc(c.model)}"><div class="vphotos">${imgs.map((im,i)=>`<img src="${im}" onclick="changeVehiclePhoto(${i})" alt="Gambar ${i+1}">`).join('')}</div>`:`<div class="vhero" style="display:grid;place-items:center;font-size:55px">🚘</div><p class="safe-note">Tiada gambar kenderaan dimuat naik.</p>`}</div>`}

render();
</script></body></html>
